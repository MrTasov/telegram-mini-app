<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё сообщество</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      background: #0b0c10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .content {
      padding: 30px 20px 100px;
    }

    h1 {
      font-size: 34px;
    }

    .card {
      background: #17191f;
      border: 1px solid #292c34;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }

    .card h2 {
      margin: 0 0 8px;
    }

    .card p {
      color: #aaa;
      margin: 0;
    }

    .menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #15171d;
      display: flex;
      justify-content: space-around;
      padding: 18px 5px 28px;
      border-top: 1px solid #292c34;
    }

    .menu div {
      text-align: center;
      font-size: 14px;
    }

    .icon {
      font-size: 25px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div class="content">
  <h1>ГЛАВНАЯ</h1>

  <div class="card">
    <h2>Добро пожаловать 👋</h2>
    <p>Это наше Telegram-приложение.</p>
  </div>

  <div class="card">
    <h2>Новое</h2>
    <p>Здесь позже появятся видео, статьи и материалы.</p>
  </div>
</div>

<div class="menu">
  <div>
    <div class="icon">▶️</div>
    Главная
  </div>

  <div>
    <div class="icon">⭕</div>
    Сообщество
  </div>

  <div>
    <div class="icon">💬</div>
    Чаты
  </div>

  <div>
    <div class="icon">♡</div>
    Помощь
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
</script>

</body>
</html>
