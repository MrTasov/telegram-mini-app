<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080a0c;
  touch-action:none;
  overscroll-behavior:none;
  font-family:Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#20251f;
}

#canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */

#hud{
  position:absolute;
  top:calc(10px + env(safe-area-inset-top));
  left:calc(10px + env(safe-area-inset-left));
  right:calc(10px + env(safe-area-inset-right));
  display:flex;
  justify-content:space-between;
  z-index:20;
  pointer-events:none;
}

.hudBox{
  padding:7px 10px;
  border-radius:11px;
  background:rgba(10,12,14,.60);
  border:1px solid rgba(255,255,255,.10);
  color:white;
  font-size:11px;
  backdrop-filter:blur(6px);
}

.hudBox strong{
  font-size:14px;
}

#healthText{
  font-weight:bold;
}

/* SETTINGS */

#settingsButton{
  position:absolute;
  top:calc(62px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(100,105,110,.20);
  color:rgba(255,255,255,.78);
  font-size:18px;
  z-index:60;
}

/* CONTROLS */

.gameControl{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:40;
  touch-action:none;
}

.joystick{
  width:92px;
  height:92px;
  border-radius:50%;
}

.joystickBase{
  position:absolute;
  left:8px;
  top:8px;
  width:76px;
  height:76px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25);
  background:rgba(120,125,130,.10);
}

.joystickStick{
  position:absolute;
  left:28px;
  top:28px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
  background:rgba(145,150,155,.32);
  color:rgba(255,255,255,.80);
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.joystick.active .joystickBase{
  background:rgba(150,155,160,.20);
}

.joystick.active .joystickStick{
  background:rgba(180,185,190,.45);
}

.controlButton{
  width:46px;
  height:46px;
  padding:0;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.27);
  background:rgba(120,125,130,.18);
  color:rgba(255,255,255,.84);
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
}

.controlButton.pressed{
  background:rgba(180,185,190,.43);
  transform:translate(-50%,-50%) scale(.94);
}

#actionButton.inactive{
  opacity:.42;
}

#actionButton.available{
  opacity:.96;
  background:rgba(135,140,145,.30);
}


/* DAMAGE FLASH */

#damageFlash{
  position:absolute;
  inset:0;
  z-index:70;
  background:rgba(170,0,0,.25);
  opacity:0;
  pointer-events:none;
  transition:opacity .12s;
}

#damageFlash.show{
  opacity:1;
}

/* MESSAGE */

#message{
  position:absolute;
  left:50%;
  bottom:calc(150px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:90;
  padding:8px 13px;
  border-radius:10px;
  background:rgba(0,0,0,.74);
  color:white;
  font-size:13px;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
}

#message.show{

}

/* FADE */

#fade{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  background:black;
  color:white;
  font-size:18px;
  letter-spacing:2px;
  opacity:0;
  pointer-events:none;

}

#fade.show{

.overlay{

<script>

/* =====================================================

function el(id){

}

function clone(obj){
  return JSON.parse(JSON.stringify(obj));
}

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function distance(x1,y1,x2,y2){
  return Math.hypot(x1-x2,y1-y2);
}

/* =====================================================

===================================================== */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){

/* =====================================================
   AUDIO
===================================================== */

/*
  Эти пять файлов должны лежать рядом с index.html:

  gunshot.mp3
  zombie.mp3
  hit.mp3
  player_hit.mp3
  footsteps.mp3
*/

let masterVolume = 0.70;

function createSound(file){
  const audio = new Audio(file);
  audio.preload = "auto";
  return audio;
}

const sounds = {
  gunshot:createSound("gunshot.mp3"),
  zombie:createSound("zombie.mp3"),
  hit:createSound("hit.mp3"),
  playerHit:createSound("player_hit.mp3"),
  footsteps:createSound("footsteps.mp3")
};

/* =====================================================
   MOBILE AUDIO ENGINE 0.4.5
===================================================== */
let audioCtx=null;
const audioBuffers={};
let audioLoadStarted=false;
let footstepsSource=null;
let footstepsGain=null;
let lastZombieBufferAt=0;

const AUDIO_FILES={
  gunshot:"gunshot.mp3",
  zombie:"zombie.mp3",
  hit:"hit.mp3",
  playerHit:"player_hit.mp3",
  footsteps:"footsteps.mp3"
};

function ensureAudioContext(){
  if(audioCtx) return audioCtx;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{audioCtx=new AC();}catch(e){audioCtx=null;}
  return audioCtx;
}

async function preloadGameAudio(){
  if(audioLoadStarted) return;
  audioLoadStarted=true;
  const ctx=ensureAudioContext();
  if(!ctx) return;

  await Promise.all(
    Object.entries(AUDIO_FILES).map(async function([name,url]){
      try{
        const r=await fetch(url,{cache:"force-cache"});
        const data=await r.arrayBuffer();
        audioBuffers[name]=await ctx.decodeAudioData(data);
      }catch(e){}
    })
  );
}

function unlockGameAudio(){
  const ctx=ensureAudioContext();
  if(ctx && ctx.state==="suspended"){
    ctx.resume().catch(function(){});
  }
  preloadGameAudio().catch(function(){});
}

// audio disabled in 0.4.6

function playBuffer(name,volume=1){

}

function stopFootsteps(){
  if(footstepsSource){
    try{footstepsSource.stop(0);}catch(e){}
    try{footstepsSource.disconnect();}catch(e){}
    footstepsSource=null;
  }
  if(footstepsGain){
    try{footstepsGain.disconnect();}catch(e){}
    footstepsGain=null;
  }
}

function startFootsteps(){
  return;
}

function updateFootstepsAudio(){
  if(playerDead || menuOpen || movePower<=JOY_DEAD){
    stopFootsteps();
    return;
  }

  startFootsteps();

  if(footstepsGain && audioCtx){
    const v=masterVolume*(movePower>=RUN_THRESHOLD?.30:.20);
    try{
      footstepsGain.gain.setValueAtTime(clamp(v,0,1),audioCtx.currentTime);
    }catch(e){}
  }
}

function zombieDistanceVolume(zombie){
  const d=Math.hypot(zombie.x-player.x,zombie.y-player.y);
  if(d>=520) return 0;
  return clamp((1-d/520)*.38,0,.38);
}

function playZombieBuffer(zombie){
  const now=performance.now();
  if(now-lastZombieBufferAt<2800) return;

  const v=zombieDistanceVolume(zombie);
  if(v<=.025) return;

  lastZombieBufferAt=now;
  playBuffer("zombie",v);
}

/* =====================================================
   CONTROL LAYOUTS
===================================================== */

const defaults = {

  portrait:{
    move:{x:.18,y:.82},
    aim:{x:.82,y:.82},
    action:{x:.72,y:.68}
  },

  landscape:{
    move:{x:.14,y:.78},
    aim:{x:.86,y:.78},
    action:{x:.76,y:.62}
  }

};

function validPoint(point,fallback){

  if(
    !point ||
    typeof point.x !== "number" ||
    typeof point.y !== "number"
  ){
    return clone(fallback);
  }

  return {
    x:clamp(point.x,.05,.95),
    y:clamp(point.y,.08,.94)
  };

}

function sanitizeLayouts(saved){

  const result =
    clone(defaults);

  for(const mode of ["portrait","landscape"]){

    if(!saved || !saved[mode]){
      continue;
    }

    for(const key of ["move","aim","action"]){

      result[mode][key] =
        validPoint(
          saved[mode][key],
          defaults[mode][key]
        );

    }

  }

  return result;
}

function loadLayouts(){

  try{

    const saved =
      localStorage.getItem(
        "base_controls_047"
      );

    if(!saved){
      return clone(defaults);
    }

    return sanitizeLayouts(
      JSON.parse(saved)
    );

  }catch(e){

    return clone(defaults);

  }

}

let layouts =
  loadLayouts();

function saveLayouts(){

  try{

    localStorage.setItem(
      "base_controls_047",
      JSON.stringify(layouts)
    );

  }catch(e){}

}

function orientation(){

  return window.innerWidth >
         window.innerHeight
         ? "landscape"
         : "portrait";

}

function positionControl(element,data){

  if(!element || !data){
    return;
  }

  element.style.left =
    (data.x * 100) + "%";

  element.style.top =
    (data.y * 100) + "%";

}

function applyControls(){

  const mode = orientation();
  const layout = layouts[mode] || defaults[mode];

  if(typeof homeJoysticks==="function"){
    homeJoysticks();
  }

}

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  el("canvas");

const ctx =
  canvas.getContext("2d");

let screenWidth = 1;
let screenHeight = 1;

function resizeCanvas(){

  screenWidth =
    Math.max(
      1,
      window.innerWidth
    );

  screenHeight =
    Math.max(
      1,
      window.innerHeight
    );

  const mobileDevice =
    window.matchMedia &&
    window.matchMedia("(pointer:coarse)").matches;

  const ratio =
    mobileDevice
    ? 1
    : Math.min(
        window.devicePixelRatio || 1,
        1.5
      );

  canvas.width =
    Math.floor(
      screenWidth * ratio
    );

  canvas.height =
    Math.floor(
      screenHeight * ratio
    );

  canvas.style.width =
    screenWidth + "px";

  canvas.style.height =
    screenHeight + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

}

/* =====================================================
   WORLD
===================================================== */

let scene =
  "surface";

let menuOpen =
  false;

let playerDead =
  false;

const player = {

  x:800,
  y:860,

  radius:15,

  health:100,
  maxHealth:100,

  walkSpeed:3.15,
  runSpeed:5.25,

  aimX:0,
  aimY:-1,

  moving:false,
  running:false,

  lastFootstep:0,
  lastDamage:0,

};

const camera = {
  x:0,
  y:0
};

function visibleOnScreen(x,y,padding){

  padding =
    padding === undefined
    ? 80
    : padding;

  return (
    x >= camera.x-padding &&
    x <= camera.x+screenWidth+padding &&
    y >= camera.y-padding &&
    y <= camera.y+screenHeight+padding
  );

}

const surface = {

  },

    gateX:750,

  },

  hatch:{
    x:800,

  }

};

const bunker = {

  width:1450,

  corridor:{
    left:610,
    right:840,
    top:200,
    bottom:1260
  },

  entrance:{
    x:725,

/* =====================================================
   0.4.6 CLAMPED FLOATING TWIN-STICK

   Each stick has:
   1) a HOME X/Y position;
   2) an invisible allowed rectangle;
   3) touches outside the rectangle still activate it,
      but the base is clamped to the nearest rectangle edge;
   4) releasing returns the base to HOME.
===================================================== */

let moveX=0, moveY=0, movePower=0;
let rightAimActive=false, aimPower=0;
let leftPointerId=null, rightPointerId=null;
let leftOriginX=0, leftOriginY=0, rightOriginX=0, rightOriginY=0;

const JOY_RADIUS=46;
const JOY_DEAD=.14;
const RUN_THRESHOLD=.72;

const moveControl=el("moveControl");
const moveStick=el("moveStick");
const aimControl=el("aimControl");
const aimStick=el("aimStick");

function joystickGeometry(side){

  const w=window.innerWidth;
  const h=window.innerHeight;
  const landscape=w>h;

  /*
    0.4.7:
    - free-floating area follows the lower-left / lower-right thumb zones;
    - inside the rectangle the base follows the finger exactly 1:1;
    - only coordinates outside it are clamped to the nearest edge;
    - HOME positions are symmetric and deliberately clear of the action button.
  */
  if(landscape){
    const minY=h*.54;
    const maxY=h-JOY_RADIUS-18;

    if(side==="left"){
      return {
        minX:JOY_RADIUS+24,
        maxX:w*.43,
        minY,
        maxY,
        homeX:w*.14,
        homeY:h*.80
      };
    }

    return {
      minX:w*.57,
      maxX:w-JOY_RADIUS-24,
      minY,
      maxY,
      homeX:w*.86,
      homeY:h*.80
    };
  }

  const minY=h*.66;
  const maxY=h-JOY_RADIUS-28;

  if(side==="left"){
    return {
      minX:JOY_RADIUS+18,
      maxX:w*.46,
      minY,
      maxY,
      homeX:w*.20,
      homeY:h*.86
    };
  }

  return {
    minX:w*.54,
    maxX:w-JOY_RADIUS-18,
    minY,
    maxY,
    homeX:w*.80,
    homeY:h*.86
  };
}

function centerJoystickKnob(stick){
  // Force the analog knob to the exact center of its base.
  stick.style.left="50%";
  stick.style.top="50%";
  stick.style.marginLeft="0";
  stick.style.marginTop="0";
  stick.style.transform="translate(-50%,-50%)";
}

function setJoystickCenter(control,x,y,visible=true){
  control.style.left=(x-JOY_RADIUS)+"px";
  control.style.top=(y-JOY_RADIUS)+"px";
  control.classList.toggle("hiddenJoystick",!visible);
}

function positionActionButton047(){
  const w=window.innerWidth;
  const h=window.innerHeight;
  const landscape=w>h;

  const button=el("actionButton");
  if(!button) return;

  // Clear of the right HOME joystick in both orientations.
  const x=w*(landscape?.76:.72);
  const y=h*(landscape?.56:.68);

  button.style.left=x+"px";
  button.style.top=y+"px";
  button.style.right="auto";
  button.style.bottom="auto";
  button.style.transform="translate(-50%,-50%)";
}

function homeJoysticks(){
  const left=joystickGeometry("left");
  const right=joystickGeometry("right");

  setJoystickCenter(moveControl,left.homeX,left.homeY,true);
  setJoystickCenter(aimControl,right.homeX,right.homeY,true);

  centerJoystickKnob(moveStick);
  centerJoystickKnob(aimStick);
  positionActionButton047();
}

function clampedJoystickOrigin(side,x,y){
  const g=joystickGeometry(side);
  return {
    x:clamp(x,g.minX,g.maxX),
    y:clamp(y,g.minY,g.maxY)
  };
}

function floatingVector(stick,ox,oy,x,y){
  const dx=x-ox, dy=y-oy;
  const distance=Math.hypot(dx,dy);
  const maxDistance=30;
  let drawX=dx, drawY=dy;

  if(distance>maxDistance){
    const k=maxDistance/distance;
    drawX*=k;
    drawY*=k;
  }

  stick.style.transform=`translate(calc(-50% + ${drawX}px),calc(-50% + ${drawY}px))`;

  const len=Math.hypot(dx,dy)||1;

  return {
    x:dx/len,
    y:dy/len,
    power:Math.min(1,distance/maxDistance)
  };
}

function uiTouch(target){
  return !!(
    target && target.closest &&
    target.closest("button,.overlay,.panel,.menuCard,.workshopPanel")
  );
}

function sideForTouch(x){
  return x<window.innerWidth*.5 ? "left" : "right";
}

window.addEventListener("pointerdown",function(e){
  if(menuOpen || playerDead || uiTouch(e.target)) return;

  const side=sideForTouch(e.clientX);

  if(side==="left" && leftPointerId===null){
    const p=clampedJoystickOrigin("left",e.clientX,e.clientY);

    leftPointerId=e.pointerId;
    leftOriginX=p.x;
    leftOriginY=p.y;

    setJoystickCenter(moveControl,leftOriginX,leftOriginY,true);

    // Important: when the finger is outside the allowed rectangle,
    // direction/power are calculated from the clamped base to the real finger.
    const v=floatingVector(
      moveStick,
      leftOriginX,leftOriginY,
      e.clientX,e.clientY
    );

    moveX=v.x;
    moveY=v.y;
    movePower=v.power;

    if(movePower>JOY_DEAD && !rightAimActive){
      player.aimX=moveX;
      player.aimY=moveY;
    }

    e.preventDefault();
    return;
  }

  if(side==="right" && rightPointerId===null){
    const p=clampedJoystickOrigin("right",e.clientX,e.clientY);

    rightPointerId=e.pointerId;
    rightOriginX=p.x;
    rightOriginY=p.y;
    rightAimActive=true;

    setJoystickCenter(aimControl,rightOriginX,rightOriginY,true);

    const v=floatingVector(
      aimStick,
      rightOriginX,rightOriginY,
      e.clientX,e.clientY
    );

    aimPower=v.power;

    if(aimPower>JOY_DEAD){
      player.aimX=v.x;
      player.aimY=v.y;
      firing=true;
      shoot();
    }else{
      firing=false;
    }

    e.preventDefault();
  }
},{passive:false});

window.addEventListener("pointermove",function(e){

  if(e.pointerId===leftPointerId){
    const v=floatingVector(
      moveStick,
      leftOriginX,leftOriginY,
      e.clientX,e.clientY
    );

    moveX=v.x;
    moveY=v.y;
    movePower=v.power;

    if(movePower>JOY_DEAD && !rightAimActive){
      player.aimX=moveX;
      player.aimY=moveY;
    }

    e.preventDefault();
  }

  if(e.pointerId===rightPointerId){
    const v=floatingVector(
      aimStick,
      rightOriginX,rightOriginY,
      e.clientX,e.clientY
    );

    aimPower=v.power;

    if(aimPower>JOY_DEAD){
      player.aimX=v.x;
      player.aimY=v.y;

      if(!firing){
        firing=true;
        shoot();
      }
    }else{
      firing=false;
    }

    e.preventDefault();
  }

},{passive:false});

function releaseFloating(e){

  if(e.pointerId===leftPointerId){
    leftPointerId=null;
    movePower=0;
    moveX=0;
    moveY=0;
    stopFootsteps();

    centerJoystickKnob(moveStick);
    const g=joystickGeometry("left");
    setJoystickCenter(moveControl,g.homeX,g.homeY,true);
  }

  if(e.pointerId===rightPointerId){
    rightPointerId=null;
    rightAimActive=false;
    aimPower=0;
    firing=false;

    centerJoystickKnob(aimStick);
    const g=joystickGeometry("right");
    setJoystickCenter(aimControl,g.homeX,g.homeY,true);

    if(movePower>JOY_DEAD){
      player.aimX=moveX;
      player.aimY=moveY;
    }
  }

}

window.addEventListener("pointerup",releaseFloating,{passive:false});
window.addEventListener("pointercancel",releaseFloating,{passive:false});

// Home positions are recalculated after orientation/viewport changes.
window.addEventListener("resize",function(){
  if(leftPointerId===null && rightPointerId===null){
    homeJoysticks();
  }
});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",function(){
    if(leftPointerId===null && rightPointerId===null){
      homeJoysticks();
    }
  });
}
 
centerJoystickKnob(moveStick);
centerJoystickKnob(aimStick);
setTimeout(homeJoysticks,0);
setTimeout(homeJoysticks,250);

/* =====================================================
   BULLETS / SHOOTING
===================================================== */

const bullets = [];

let firing = false;
let lastShot = 0;

function shoot(){

  if(
    menuOpen ||
    playerDead ||
    scene !== "surface"
  ){
    return;
  }

  const now =
    performance.now();

  if(now-lastShot < 155){
    return;
  }

  lastShot = now;

  let length =
    Math.hypot(
      player.aimX,
      player.aimY
    );

  if(length === 0){
    length = 1;
  }

  const dx =
    player.aimX /
    length;

  const dy =
    player.aimY /
    length;

  bullets.push({

    x:
      player.x +
      dx*29,

    y:
      player.y +
      dy*29,

    dx:
      dx*12,

    dy:
      dy*12,

    radius:4,

    life:80

  });

  playGunshot();

  createNoise(
    player.x,
    player.y,
    550
  );

  muzzleFlash.time =
    performance.now();

  muzzleFlash.x =
    player.x +
    dx*30;

  muzzleFlash.y =
    player.y +
    dy*30;

}

const muzzleFlash = {
  x:0,
  y:0,
  time:0
};

function hitZombie(zombie){

  zombie.health -= 25;

  zombie.hitFlash =
    performance.now();

  zombie.state =
    "chase";

  playSound(
    sounds.hit,
    .65
  );

  if(zombie.health <= 0){

    zombie.health = 0;

    zombie.alive = false;

    zombie.deathTime =
      performance.now();

  }

}

function updateBullets(){

  if(firing){
    shoot();
  }

  for(
    let i =
      bullets.length-1;

    i >= 0;

    i--
  ){

    const bullet =
      bullets[i];

    bullet.x +=
      bullet.dx;

    bullet.y +=
      bullet.dy;

    bullet.life--;

    let removed = false;

    if(scene === "surface"){

      for(const zombie of zombies){

        if(!zombie.alive){
          continue;
        }

        if(
          distance(
            bullet.x,
            bullet.y,
            zombie.x,
            zombie.y
          )
          <
          zombie.radius +
          bullet.radius
        ){

          hitZombie(zombie);

          bullets.splice(
            i,
            1
          );

          removed = true;

          break;

        }

      }

    }

    if(removed){
      continue;
    }

    if(bullet.life <= 0){

      bullets.splice(
        i,
        1
      );

    }

  }

}

/* =====================================================
   COLLISION
===================================================== */

function surfaceCollision(x,y){

  const r =
    player.radius;

  const outer =
    surface.outer;

  if(
    x <
    outer.left +
    outer.thickness +
    r
  ) return true;

  if(
    x >
    outer.right -
    outer.thickness -
    r
  ) return true;

  if(
    y <
    outer.top +
    outer.thickness +
    r
  ) return true;

  if(
    y >
    outer.bottom -
    outer.thickness -
    r
  ) return true;

  const inner =
    surface.inner;

  const wall =
    inner.thickness;

  if(
    x > inner.left-r &&
    x < inner.right+r &&
    y > inner.top-r &&
    y < inner.top+wall+r
  ){
    return true;
  }

  if(
    y > inner.top-r &&
    y < inner.bottom+r &&
    x > inner.left-r &&
    x < inner.left+wall+r
  ){
    return true;
  }

  if(
    y > inner.top-r &&
    y < inner.bottom+r &&
    x > inner.right-wall-r &&
    x < inner.right+r
  ){
    return true;
  }

  if(
    y > inner.bottom-wall-r &&
    y < inner.bottom+r &&
    x > inner.left-r &&
    x < inner.right+r
  ){

    const gate =
      x > inner.gateX &&
      x <
      inner.gateX +
      inner.gateWidth;

    if(!gate){
      return true;
    }

  }

  return false;
}

function bunkerCollision(x,y){

  const r =
    player.radius;

  const corridor =
    bunker.corridor;

  const workshop =
    bunker.workshop;

  const inCorridor =
    x >= corridor.left+r &&
    x <= corridor.right-r &&
    y >= corridor.top+r &&
    y <= corridor.bottom-r;

  const inWorkshop =
    x >= workshop.left+r &&
    x <= workshop.right-r &&
    y >= workshop.top+r &&
    y <= workshop.bottom-r;

  const inDoor =
    x >= workshop.right-30 &&
    x <= corridor.left+30 &&
    y >= workshop.doorTop &&
    y <= workshop.doorBottom;

  return !(
    inCorridor ||
    inWorkshop ||
    inDoor
  );

}

/* =====================================================
   MOVEMENT / FOOTSTEPS
===================================================== */

function updatePlayer(){

  if(menuOpen || playerDead){
    return;
  }

  player.moving = movePower > JOY_DEAD;
  player.running = movePower >= RUN_THRESHOLD;

  if(!player.moving){
    return;
  }

  const length=Math.hypot(moveX,moveY)||1;
  const x=moveX/length;
  const y=moveY/length;

  // Two speeds: inner movement = walk, outer movement = run.
  const speed=player.running ? player.runSpeed : player.walkSpeed;

  const collision =
    scene === "surface"
    ? surfaceCollision
    : bunkerCollision;

  const newX =
    player.x +
    x*speed;

  const newY =
    player.y +
    y*speed;

  if(
    !collision(
      newX,
      player.y
    )
  ){
    player.x = newX;
  }

  if(
    !collision(
      player.x,
      newY
    )
  ){
    player.y = newY;
  }

  player.walkAnimation +=
    .21;

  const now =
    performance.now();

  if(
    now -
    player.lastFootstep
    >
    430
  ){

    player.lastFootstep =
      now;

    /* footsteps handled by looped WebAudio */

    if(scene === "surface"){

      createNoise(
        player.x,
        player.y,
        120
      );

    }

  }

}

/* =====================================================
   ZOMBIE AI
===================================================== */

function zombieCanMoveTo(x,y){

  /*
    Пока заражённые используют ту же геометрию стен,
    но с небольшим запасом.
  */

  const outer =
    surface.outer;

  if(
    x <
    outer.left +
    outer.thickness +
    15
  ) return false;

  if(
    x >
    outer.right -
    outer.thickness -
    15
  ) return false;

  if(
    y <
    outer.top +
    outer.thickness +
    15
  ) return false;

  if(
    y >
    outer.bottom -
    outer.thickness -
    15
  ) return false;

  return true;
}

function updateZombies(){
  const aiNow=performance.now();
  if(updateZombies._last && aiNow-updateZombies._last<32) return;
  updateZombies._last=aiNow;


  if(
    scene !== "surface" ||
    menuOpen ||
    playerDead
  ){
    return;
  }

  const now =
    performance.now();

  for(const zombie of zombies){

    if(!zombie.alive){
      continue;
    }

    const playerDistance =
      distance(
        zombie.x,
        zombie.y,
        player.x,
        player.y
      );

    /* SEE PLAYER */

    if(playerDistance < 270){

      zombie.state =
        "chase";

    }

    /* HEAR NOISE */

    if(
      now -
      noiseEvent.time
      <
      650
    ){

      const noiseDistance =
        distance(
          zombie.x,
          zombie.y,
          noiseEvent.x,
          noiseEvent.y
        );

      if(
        noiseDistance <
        noiseEvent.radius
      ){

        zombie.state =
          "chase";

      }

    }

    /* GROWL */

    if(
      playerDistance < 330 &&
      now > zombie.lastGrowl
    ){

      playZombieBuffer(zombie);

      zombie.lastGrowl =
        now +
        3500 +
        Math.random()*4500;

    }

    /* CHASE */

    if(zombie.state === "chase"){

      if(playerDistance > 430){

        zombie.state =
          "wander";

      }

      else if(playerDistance > 31){

        const dx =
          (
            player.x -
            zombie.x
          ) /
          playerDistance;

        const dy =
          (
            player.y -
            zombie.y
          ) /
          playerDistance;

        const nextX =
          zombie.x +
          dx *
          zombie.chaseSpeed;

        const nextY =
          zombie.y +
          dy *
          zombie.chaseSpeed;

        if(
          zombieCanMoveTo(
            nextX,
            zombie.y
          )
        ){
          zombie.x = nextX;
        }

        if(
          zombieCanMoveTo(
            zombie.x,
            nextY
          )
        ){
          zombie.y = nextY;
        }

      }

      /* ATTACK */

      if(
        playerDistance < 34 &&
        now -
        zombie.lastAttack
        >
        950
      ){

        zombie.lastAttack =
          now;

        damagePlayer(10);

      }

    }

    /* WANDER */

    else{

      if(
        now >
        zombie.nextWanderChange
      ){

        zombie.wanderAngle =
          Math.random() *
          Math.PI * 2;

        zombie.nextWanderChange =
          now +
          1200 +
          Math.random()*2600;

      }

      const nextX =
        zombie.x +
        Math.cos(
          zombie.wanderAngle
        ) *
        zombie.speed;

      const nextY =
        zombie.y +
        Math.sin(
          zombie.wanderAngle
        ) *
        zombie.speed;

      if(
        zombieCanMoveTo(
          nextX,
          zombie.y
        )
      ){
        zombie.x = nextX;
      }

      if(
        zombieCanMoveTo(
          zombie.x,
          nextY
        )
      ){
        zombie.y = nextY;
      }

    }

  }

}

  );

}

   MESSAGE

let messageTimer = null;

function message(text){

  const box =
    el("message");

  box.textContent =
    text;

  box.classList.add(
    "show"
  );

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      function(){

        box.classList.remove(
          "show"
        );

      },
      1300
    );

}

/* =====================================================
   TRANSITIONS
===================================================== */

function transition(title,callback){

  const fade =
    el("fade");

  fade.textContent =
    title;

  fade.classList.add(
    "show"
  );

  movePower = 0;
  firing = false;

  setTimeout(
    function(){

      callback();

      setTimeout(
        function(){

          fade.classList.remove(
            "show"
          );

        },
        260
      );

    },
    400
  );

}

/* =====================================================
   DRAW SURFACE
===================================================== */

function drawSurface(){

  ctx.fillStyle =
    "#3c4439";

  ctx.fillRect(
    0,
    0,
    surface.width,
    surface.height
  );

  /* GROUND */

  for(
    let x=50;
    x<surface.width;
    x+=160
  ){

    for(
      let y=50;
      y<surface.height;
      y+=160
    ){

      ctx.fillStyle =
        "rgba(0,0,0,.035)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        20,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

  /* OUTER WALL */

  const o =
    surface.outer;

  ctx.fillStyle =
    "#5c6260";

  ctx.fillRect(
    o.left,
    o.top,
    o.right-o.left,
    o.thickness
  );

  ctx.fillRect(
    o.left,
    o.top,
    o.thickness,
    o.bottom-o.top
  );

  ctx.fillRect(
    o.right-o.thickness,
    o.top,
    o.thickness,
    o.bottom-o.top
  );

  ctx.fillRect(
    o.left,
    o.bottom-o.thickness,
    o.right-o.left,
    o.thickness
  );

  /* MAIN GATE */

  ctx.fillStyle =
    "#292d2d";

  ctx.fillRect(
    730,
    o.bottom-o.thickness,
    140,
    o.thickness
  );

  /* INNER WALL */

  const i =
    surface.inner;

  ctx.fillStyle =
    "#6d6d64";

  ctx.fillRect(
    i.left,
    i.top,
    i.right-i.left,
    i.thickness
  );

  ctx.fillRect(
    i.left,
    i.top,
    i.thickness,
    i.bottom-i.top
  );

  ctx.fillRect(
    i.right-i.thickness,
    i.top,
    i.thickness,
    i.bottom-i.top
  );

  ctx.fillRect(
    i.left,
    i.bottom-i.thickness,
    i.gateX-i.left,
    i.thickness
  );

  ctx.fillRect(
    i.gateX+i.gateWidth,
    i.bottom-i.thickness,
    i.right-
    (
      i.gateX+
      i.gateWidth
    ),
    i.thickness
  );

  /* INNER FLOOR */

  ctx.fillStyle =
    "#57584f";

  ctx.fillRect(
    i.left+i.thickness,
    i.top+i.thickness,
    i.right-i.left-i.thickness*2,
    i.bottom-i.top-i.thickness*2
  );

  /* HATCH */

  ctx.fillStyle =
    "#17191a";

  ctx.fillRect(
    765,
    555,
    70,
    70
  );

  ctx.strokeStyle =
    "#aaaaaa";

  ctx.lineWidth =
    4;

  ctx.strokeRect(
    765,
    555,
    70,
    70
  );

  ctx.fillStyle =
    "white";

  ctx.font =
    "13px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "ЛЮК",
    800,
    595
  );

  /* FARM */

  ctx.fillStyle =
    "#566e42";

  ctx.fillRect(
    300,
    300,
    190,
    120
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "ФЕРМА",
    395,
    365
  );

  /* GENERATOR */

  ctx.fillStyle =
    "#454a4d";

  ctx.fillRect(
    1080,
    310,
    125,
    90
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "ГЕНЕРАТОР",
    1142,
    362
  );

  /* CAR */

  ctx.fillStyle =
    "#38444b";

  ctx.fillRect(
    1100,
    790,
    160,
    75
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "МАШИНА",
    1180,
    833
  );

  /* TOWERS */

  const towers = [
    [200,160],
    [800,150],
    [1400,160],
    [200,1040],
    [800,1040],
    [1400,1040]
  ];

  for(const tower of towers){

    ctx.fillStyle =
      "#282c2d";

    ctx.fillRect(
      tower[0]-25,
      tower[1]-25,
      50,
      50
    );

    ctx.fillStyle =
      "#777c7c";

    ctx.fillRect(
      tower[0]-16,
      tower[1]-16,
      32,
      32
    );

  }

}

/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

  let length =
    Math.hypot(
      player.aimX,
      player.aimY
    );

  if(length === 0){
    length = 1;
  }

  const ax =
    player.aimX /
    length;

  const ay =
    player.aimY /
    length;

  const angle =
    Math.atan2(
      ay,
      ax
    );

  const bob =
    player.moving
    ? Math.sin(
        player.walkAnimation
      ) * 2
    : 0;

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(angle);

  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.30)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    12,
    18,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* LEGS */

  ctx.strokeStyle =
    "#252b2d";

  ctx.lineWidth =
    7;

  ctx.lineCap =
    "round";

  ctx.beginPath();

  ctx.moveTo(
    -5,
    8
  );

  ctx.lineTo(
    -8,
    22+bob
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    5,
    8
  );

  ctx.lineTo(
    8,
    22-bob
  );

  ctx.stroke();

  /* BODY */

  ctx.fillStyle =
    "#3d5865";

  ctx.beginPath();

  ctx.roundRect(
    -11,
    -10,
    22,
    29,
    6
  );

  ctx.fill();

  /* BACKPACK */

  ctx.fillStyle =
    "#303a34";

  ctx.fillRect(
    -14,
    -5,
    7,
    19
  );

  /* HEAD */

  ctx.fillStyle =
    "#c9a27d";

  ctx.beginPath();

  ctx.arc(
    3,
    -16,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* ARMS */

  ctx.strokeStyle =
    "#c39c78";

  ctx.lineWidth =
    5;

  ctx.beginPath();

  ctx.moveTo(
    5,
    -4
  );

  ctx.lineTo(
    18,
    -1
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    4,
    7
  );

  ctx.lineTo(
    18,
    3
  );

  ctx.stroke();

  /* WEAPON */

  ctx.strokeStyle =
    "#141718";

  ctx.lineWidth =
    5;

  ctx.beginPath();

  ctx.moveTo(
    11,
    1
  );

  ctx.lineTo(
    31,
    1
  );

  ctx.stroke();

  ctx.strokeStyle =
    "#555b5c";

  ctx.lineWidth =
    2;

  ctx.beginPath();

  ctx.moveTo(
    28,
    1
  );

  ctx.lineTo(
    36,
    1
  );

  ctx.stroke();

  ctx.restore();

  /* AIM LINE */

  ctx.strokeStyle =
    "rgba(255,230,160,.25)";

  ctx.lineWidth =
    1;

  ctx.beginPath();

  ctx.moveTo(
    player.x+ax*34,
    player.y+ay*34
  );

  ctx.lineTo(
    player.x+ax*80,
    player.y+ay*80
  );

  ctx.stroke();

  ctx.strokeStyle =
    "rgba(255,235,175,.68)";

  ctx.beginPath();

  ctx.arc(
    player.x+ax*88,
    player.y+ay*88,
    4,
    0,
    Math.PI*2
  );

  ctx.stroke();

}

/* =====================================================
   DRAW ZOMBIES
===================================================== */

function drawZombie(zombie){

  if(!zombie.alive){

    /*
      Тело остаётся на земле.
    */

    ctx.save();

    ctx.translate(
      zombie.x,
      zombie.y
    );

    ctx.rotate(.9);

    ctx.fillStyle =
      "rgba(70,83,64,.70)";

    ctx.fillRect(
      -15,
      -7,
      30,
      14
    );

    ctx.fillStyle =
      "rgba(118,130,101,.65)";

    ctx.beginPath();

    ctx.arc(
      17,
      0,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    return;
  }

  const angle =
    Math.atan2(
      player.y-zombie.y,
      player.x-zombie.x
    );

  const hit =
    performance.now() -
    zombie.hitFlash
    <
    100;

  ctx.save();

  ctx.translate(
    zombie.x,
    zombie.y
  );

  ctx.rotate(angle);

  /* SHADOW */

  ctx.fillStyle =
    "rgba(0,0,0,.28)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    12,
    17,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* BODY */

  ctx.fillStyle =
    hit
    ? "#b9b5a5"
    : "#59634f";

  ctx.fillRect(
    -10,
    -8,
    20,
    29
  );

  /* HEAD */

  ctx.fillStyle =
    hit
    ? "#d3cbb5"
    : "#87917a";

  ctx.beginPath();

  ctx.arc(
    3,
    -15,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* ARMS */

  ctx.strokeStyle =
    "#747e68";

  ctx.lineWidth =
    5;

  ctx.beginPath();

  ctx.moveTo(
    5,
    -2
  );

  ctx.lineTo(
    22,
    -5
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(
    5,
    6
  );

  ctx.lineTo(
    22,
    8
  );

  ctx.stroke();

  ctx.restore();

  /* HEALTH */

  if(
    zombie.health <
    zombie.maxHealth
  ){

    const width = 34;

    ctx.fillStyle =
      "rgba(0,0,0,.65)";

    ctx.fillRect(
      zombie.x-width/2,
      zombie.y-36,
      width,
      4
    );

    ctx.fillStyle =
      "#b94d4d";

    ctx.fillRect(
      zombie.x-width/2,
      zombie.y-36,
      width *
      (
        zombie.health /
        zombie.maxHealth
      ),
      4
    );

  }

}

/* =====================================================
   DRAW BULLETS / MUZZLE
===================================================== */

function drawBullets(){

  for(const bullet of bullets){

    if(!visibleOnScreen(bullet.x,bullet.y,30)){
      continue;
    }

    ctx.fillStyle =
      "rgba(255,215,120,.25)";

    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
      "#ffd778";

    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      3.5,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  if(
    performance.now() -
    muzzleFlash.time
    <
    65
  ){

    ctx.fillStyle =
      "rgba(255,220,100,.85)";

    ctx.beginPath();

    ctx.arc(
      muzzleFlash.x,
      muzzleFlash.y,
      10,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

/* =====================================================
   CONTROL EDITOR
===================================================== */

let editingMode =
  "portrait";

let editingLayout =
  clone(
    layouts.portrait
  );

const stage =
  el("editorStage");

const previews = {

  aim:
    el("previewAim"),

  action:
    el("previewAction"),

  move:
    el("previewMove"),

};

function previewPosition(element,position){

  element.style.left =
    position.x*100 +
    "%";

  element.style.top =
    position.y*100 +
    "%";

}

function renderEditor(){

  for(const key of Object.keys(previews)){

    previewPosition(
      previews[key],
      editingLayout[key]
    );

  }

}

function switchEditor(mode){

  /*
    Сохраняем временное положение текущей вкладки
    в памяти, чтобы переключение portrait/landscape
    не теряло изменения.
  */

  layouts[editingMode] =
    clone(
      editingLayout
    );

  editingMode =
    mode;

  editingLayout =
    clone(
      layouts[mode]
    );

  stage.className =
    mode;

  el("portraitTab").classList.toggle(
    "active",
    mode === "portrait"
  );

  el("landscapeTab").classList.toggle(
    "active",
    mode === "landscape"
  );

  renderEditor();

}

el("portraitTab").addEventListener(
  "click",
  function(){

    switchEditor(
      "portrait"
    );

  }
);

el("landscapeTab").addEventListener(
  "click",
  function(){

    switchEditor(
      "landscape"
    );

  }
);

function draggable(element,key){

  let pointer = null;

  function update(e){

    const rect =
      stage.getBoundingClientRect();

    let x =
      (
        e.clientX -
        rect.left
      ) /
      rect.width;

    let y =
      (
        e.clientY -
        rect.top
      ) /
      rect.height;

    const margin =
      (key === "aim" || key === "move")
      ? .09
      : .06;

    x =
      clamp(
        x,
        margin,
        1-margin
      );

    y =
      clamp(
        y,
        margin,
        1-margin
      );

    editingLayout[key] = {
      x:x,
      y:y
    };

    previewPosition(
      element,
      editingLayout[key]
    );

  }

  element.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      pointer =
        e.pointerId;

      element.classList.add(
        "dragging"
      );

      try{

        element.setPointerCapture(
          e.pointerId
        );

      }catch(error){}

      update(e);

    }
  );

  element.addEventListener(
    "pointermove",
    function(e){

      if(e.pointerId !== pointer){
        return;
      }

      e.preventDefault();

      update(e);

    }
  );

  function stop(){

    pointer = null;

    element.classList.remove(
      "dragging"
    );

  }

  element.addEventListener(
    "pointerup",
    stop
  );

  element.addEventListener(
    "pointercancel",
    stop
  );

}

for(const key of Object.keys(previews)){

  draggable(
    previews[key],
    key
  );

}

el("openControlSettings").addEventListener(
  "click",
  function(){

    closeOverlay(
      el("settingsOverlay")
    );

    editingMode =
      orientation();

    editingLayout =
      clone(
        layouts[editingMode]
      );

    stage.className =
      editingMode;

    el("portraitTab").classList.toggle(
      "active",
      editingMode === "portrait"
    );

    el("landscapeTab").classList.toggle(
      "active",
      editingMode === "landscape"
    );

    renderEditor();

    openOverlay(
      el("controlOverlay")
    );

  }
);

el("saveControls").addEventListener(
  "click",
  function(){

    layouts[editingMode] =
      clone(
        editingLayout
      );

    layouts =
      sanitizeLayouts(
        layouts
      );

    saveLayouts();

    applyControls();

    message(
      "Управление сохранено"
    );

  }
);

el("resetControls").addEventListener(
  "click",
  function(){

    editingLayout =
      clone(
        defaults[editingMode]
      );

    layouts[editingMode] =
      clone(
        editingLayout
      );

    saveLayouts();

    renderEditor();

    applyControls();

    message(
      "Раскладка сброшена"
    );

  }
);

el("backControls").addEventListener(
  "click",
  function(){

    layouts =
      loadLayouts();

    closeOverlay(
      el("controlOverlay")
    );

    openOverlay(
      el("settingsOverlay")
    );

    applyControls();

  }
);

/* =====================================================
   RESIZE
===================================================== */

function refreshViewport(){
  resizeCanvas();
  applyControls();
  updateCamera();
}

window.addEventListener("resize",refreshViewport);

window.addEventListener("orientationchange",function(){
  refreshViewport();
  setTimeout(refreshViewport,80);
  setTimeout(refreshViewport,180);

  setTimeout(function(){
    fullscreen();
    refreshViewport();
  },420);

  setTimeout(refreshViewport,750);
});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",refreshViewport);
}

try{
  if(tg && tg.onEvent){
    tg.onEvent("viewportChanged",refreshViewport);
    tg.onEvent("safeAreaChanged",refreshViewport);
    tg.onEvent("contentSafeAreaChanged",refreshViewport);
  }
}catch(e){}


/* =====================================================
   PREVENT TELEGRAM SWIPE
===================================================== */

document.addEventListener(
  "touchmove",
  function(e){

    if(
      !e.target.closest(
        ".panel"
      )
    ){

      e.preventDefault();

    }

  },
  {
    passive:false
  }
);

/* =====================================================
   UPDATE
===================================================== */

function update(){

  updatePlayer();

  updateBullets();

  updateZombies();

  updateAction();

  updateCamera();

}

/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    screenWidth,
    screenHeight
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );

  if(scene === "surface"){

    drawSurface();

  }else{

    drawBunker();

  }

  if(scene === "surface"){

    for(const zombie of zombies){
      drawZombie(zombie);
    }

  }

  drawBullets();

  drawPlayer();

  ctx.restore();

}

/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

  if(rightAimActive && aimPower>JOY_DEAD && firing && !menuOpen && !playerDead){
    shoot();
  }


  if(document.hidden){
    requestAnimationFrame(gameLoop);
    return;
  }


  try{

    update();
    draw();

  }catch(error){

    console.error(
      "Game loop error:",
      error
    );

  }

  requestAnimationFrame(
    gameLoop
  );

}

/* =====================================================
   START
===================================================== */

/*
  Всё важное уже создано ВЫШЕ.
  Только теперь запускается Canvas.
*/

resizeCanvas();

applyControls();

updateCamera();

console.log("0.4.7: controls calibrated; audio disabled");

gameLoop();

/*
  Telegram fullscreen запускается ПОСЛЕ игры.
*/

setTimeout(
  fullscreen,
  400
);

</script>
