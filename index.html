<style>

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080a0c;
  touch-action: none;
  overscroll-behavior: none;
  font-family: Arial, sans-serif;
}

body {
  position: fixed;
  inset: 0;
}

#game {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #20251f;
}

#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* =========================
   HUD
========================= */

#hud {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  left: calc(10px + env(safe-area-inset-left));
  right: calc(10px + env(safe-area-inset-right));

  display: flex;
  justify-content: space-between;

  z-index: 20;
  pointer-events: none;
}

.hudBox {
  background: rgba(10, 12, 14, 0.58);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 11px;

  padding: 7px 10px;

  color: white;
  font-size: 11px;

  backdrop-filter: blur(6px);
}

.hudBox strong {
  font-size: 14px;
}

/* =========================
   SETTINGS
========================= */

#settingsButton {
  position: absolute;

  top: calc(62px + env(safe-area-inset-top));
  right: calc(12px + env(safe-area-inset-right));

  width: 38px;
  height: 38px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,0.18);

  background: rgba(100,105,110,0.20);

  color: rgba(255,255,255,0.75);

  font-size: 18px;

  z-index: 50;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================
   GAME CONTROLS
========================= */

.gameControl {
  position: absolute;
  z-index: 40;

  transform: translate(-50%, -50%);

  touch-action: none;
}

/* JOYSTICKS */

.joystick {
  width: 92px;
  height: 92px;

  border-radius: 50%;
}

.joystickBase {
  position: absolute;

  left: 8px;
  top: 8px;

  width: 76px;
  height: 76px;

  border-radius: 50%;

  border: 1.5px solid rgba(255,255,255,0.25);

  background: rgba(120,125,130,0.10);
}

.joystickStick {
  position: absolute;

  left: 28px;
  top: 28px;

  width: 36px;
  height: 36px;

  border-radius: 50%;

  border: 1.5px solid rgba(255,255,255,0.35);

  background: rgba(145,150,155,0.32);

  color: rgba(255,255,255,0.78);

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;
}

.joystick.active .joystickBase {
  background: rgba(150,155,160,0.20);
}

.joystick.active .joystickStick {
  background: rgba(180,185,190,0.45);
}

/* BUTTONS */

.controlButton {
  width: 52px;
  height: 52px;

  border-radius: 50%;

  border: 1.5px solid rgba(255,255,255,0.26);

  background: rgba(120,125,130,0.18);

  color: rgba(255,255,255,0.82);

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  font-size: 22px;

  backdrop-filter: blur(5px);
}

.controlButton.pressed {
  background: rgba(170,175,180,0.40);
}

#actionButton.inactive {
  opacity: 0.42;
}

#actionButton.available {
  opacity: 0.95;
  background: rgba(135,140,145,0.30);
}

/* =========================
   MESSAGE
========================= */

#message {
  position: absolute;

  left: 50%;
  bottom: calc(145px + env(safe-area-inset-bottom));

  transform: translateX(-50%);

  z-index: 80;

  padding: 8px 13px;

  border-radius: 10px;

  background: rgba(0,0,0,0.72);

  color: white;

  font-size: 13px;

  opacity: 0;

  transition: opacity 0.2s;

  pointer-events: none;
}

#message.show {
  opacity: 1;
}

/* =========================
   FADE
========================= */

#fade {
  position: absolute;
  inset: 0;

  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;

  background: black;

  color: white;

  font-size: 18px;
  letter-spacing: 2px;

  pointer-events: none;

}

#fade.show {

}

/* =========================

========================= */

.overlay {

  align-items: center;
  justify-content: center;

<script>

/* =========================================
   HELPERS
========================================= */

function el(id) {
  return document.getElementById(id);
}

function clone(obj) {
  return JSON.parse(
    JSON.stringify(obj)
  );
}

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}

/* =========================================
   TELEGRAM
========================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg) {

  try {
    tg.ready();
  } catch (e) {}

  try {
    tg.expand();
  } catch (e) {}

  try {

    if (
      typeof
      tg.disableVerticalSwipes
      === "function"
    ) {

      tg.disableVerticalSwipes();

    }

  } catch (e) {}

}

function fullscreen() {

  if (!tg) {
    return;
  }

  try {
    tg.expand();
  } catch (e) {}

  try {

    if (
      typeof
      tg.requestFullscreen
      === "function"
    ) {

      tg.requestFullscreen();

    }

  } catch (e) {}

}

/* =========================================
   DEFAULT CONTROL POSITIONS
========================================= */

const defaults = {

  portrait: {

    move: {
      x: 0.18,
      y: 0.82
    },

    aim: {
      x: 0.80,
      y: 0.82
    },

    fire: {
      x: 0.71,
      y: 0.65
    },

    action: {
      x: 0.88,
      y: 0.62
    }

  },

  landscape: {

    move: {
      x: 0.12,
      y: 0.78
    },

    aim: {
      x: 0.88,
      y: 0.78
    },

    fire: {
      x: 0.79,
      y: 0.55
    },

    action: {
      x: 0.92,
      y: 0.49
    }

  }

};

/* =========================================
   LOAD CONTROL SETTINGS
========================================= */

function loadLayouts() {

  try {

    const saved =
      localStorage.getItem(
        "base_controls_031"
      );

    if (!saved) {
      return clone(defaults);
    }

    const parsed =
      JSON.parse(saved);

    if (
      !parsed.portrait ||
      !parsed.landscape
    ) {

      return clone(defaults);

    }

    return parsed;

  }

  catch (error) {

    return clone(defaults);

  }

}

let layouts =
  loadLayouts();

/* =========================================
   CONTROL POSITION
========================================= */

function orientation() {

  if (
    window.innerWidth >
    window.innerHeight
  ) {

    return "landscape";

  }

  return "portrait";

}

function positionControl(
  element,
  data
) {

  if (
    !element ||
    !data
  ) {

    return;

  }

  element.style.left =
    (
      clamp(
        data.x,
        0.05,
        0.95
      ) *
      100
    ) +
    "%";

  element.style.top =
    (
      clamp(
        data.y,
        0.08,
        0.94
      ) *
      100
    ) +
    "%";

}

function applyControls() {

  let mode =
    orientation();

  let layout =
    layouts[mode];

  if (!layout) {

    layout =
      defaults[mode];

  }

  positionControl(
    el("moveControl"),
    layout.move
  );

  positionControl(
    el("aimControl"),
    layout.aim
  );

  positionControl(
    el("fireButton"),
    layout.fire
  );

  positionControl(
    el("actionButton"),
    layout.action
  );

}

/* =========================================
   CANVAS
========================================= */

const canvas =
  el("canvas");

const ctx =
  canvas.getContext("2d");

let screenWidth = 1;
let screenHeight = 1;

function resizeCanvas() {

  screenWidth =
    Math.max(
      1,
      window.innerWidth
    );

  screenHeight =
    Math.max(
      1,
      window.innerHeight
    );

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      screenWidth *
      ratio
    );

  canvas.height =
    Math.floor(
      screenHeight *
      ratio
    );

  canvas.style.width =
    screenWidth +
    "px";

  canvas.style.height =
    screenHeight +
    "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

}

/* =========================================
   GAME DATA
========================================= */

let scene =
  "surface";

let menuOpen =
  false;

const player = {

  x: 800,
  y: 860,

  radius: 16,

  speed: 4,

  aimX: 0,
  aimY: -1

};

const camera = {

  x: 0,
  y: 0

};

const surface = {

  width: 1600,
  height: 1200,

  outer: {

    left: 170,
    top: 130,
    right: 1430,
    bottom: 1070,

    thickness: 45

  },

  inner: {

    left: 610,
    top: 420,
    right: 990,
    bottom: 760,

    thickness: 28,

    gateX: 750,
    gateWidth: 100

  },

  hatch: {

    x: 800,
    y: 590

  }

};

const bunker = {

  width: 1450,
  height: 1450,

  corridor: {

    left: 610,
    right: 840,

    top: 200,
    bottom: 1260

  },

  entrance: {

    x: 725,
    y: 1180

  },

  workshop: {

    left: 260,
    right: 610,

    top: 850,
    bottom: 1120,

    doorTop: 905,
    doorBottom: 1015

  }

};

/* =========================================
   INPUT
========================================= */

let moveX = 0;
let moveY = 0;

function setupJoystick(
  zone,
  stick,
  callback
) {

  let pointer =
    null;

  const maxDistance =
    28;

  function move(e) {

    const rect =
      zone.getBoundingClientRect();

    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;

    let dx =
      e.clientX -
      centerX;

    let dy =
      e.clientY -
      centerY;

    let length =
      Math.hypot(
        dx,
        dy
      );

    if (
      length >
      maxDistance
    ) {

      dx =
        dx /
        length *
        maxDistance;

      dy =
        dy /
        length *
        maxDistance;

    }

    stick.style.transform =
      "translate(" +
      dx +
      "px," +
      dy +
      "px)";

    callback(
      dx /
      maxDistance,

      dy /
      maxDistance
    );

  }

  function stop(e) {

    if (
      pointer !== null &&
      e.pointerId !==
      pointer
    ) {

      return;

    }

    pointer = null;

    zone.classList.remove(
      "active"
    );

    stick.style.transform =
      "translate(0px,0px)";

    callback(
      0,
      0
    );

  }

  zone.addEventListener(
    "pointerdown",
    function(e) {

      if (menuOpen) {
        return;
      }

      e.preventDefault();

      pointer =
        e.pointerId;

      zone.classList.add(
        "active"
      );

      try {

        zone.setPointerCapture(
          e.pointerId
        );

      } catch (error) {}

      move(e);

    }
  );

  zone.addEventListener(
    "pointermove",
    function(e) {

      if (
        e.pointerId !==
        pointer
      ) {

        return;

      }

      e.preventDefault();

      move(e);

    }
  );

  zone.addEventListener(
    "pointerup",
    stop
  );

  zone.addEventListener(
    "pointercancel",
    stop
  );

}

setupJoystick(

  el("moveControl"),

  el("moveStick"),

  function(x,y) {

    moveX = x;
    moveY = y;

  }

);

setupJoystick(

  el("aimControl"),

  el("aimStick"),

  function(x,y) {

    let power =
      Math.hypot(
        x,
        y
      );

    if (
      power >
      0.13
    ) {

      player.aimX = x;
      player.aimY = y;

    }

  }

);

/* =========================================
   SHOOTING
========================================= */

const bullets = [];

let firing =
  false;

let lastShot =
  0;

function shoot() {

  let now =
    performance.now();

  if (
    now -
    lastShot <
    150
  ) {

    return;

  }

  lastShot =
    now;

  let length =
    Math.hypot(
      player.aimX,
      player.aimY
    );

  if (
    length === 0
  ) {

    length = 1;

  }

  let dx =
    player.aimX /
    length;

  let dy =
    player.aimY /
    length;

  bullets.push({

    x:
      player.x +
      dx * 25,

    y:
      player.y +
      dy * 25,

    dx:
      dx * 11,

    dy:
      dy * 11,

    life: 80

  });

}

const fireButton =
  el("fireButton");

fireButton.addEventListener(
  "pointerdown",
  function(e) {

    if (menuOpen) {
      return;
    }

    e.preventDefault();

    firing = true;

    fireButton.classList.add(
      "pressed"
    );

    shoot();

  }
);

function stopFire() {

  firing = false;

  fireButton.classList.remove(
    "pressed"
  );

}

fireButton.addEventListener(
  "pointerup",
  stopFire
);

fireButton.addEventListener(
  "pointercancel",
  stopFire
);

function updateBullets() {

  if (firing) {

    shoot();

  }

  for (
    let i =
      bullets.length - 1;

    i >= 0;

    i--
  ) {

    let bullet =
      bullets[i];

    bullet.x +=
      bullet.dx;

    bullet.y +=
      bullet.dy;

    bullet.life--;

    if (
      bullet.life <= 0
    ) {

      bullets.splice(
        i,
        1
      );

    }

  }

}

/* =========================================
   COLLISION
========================================= */

function surfaceCollision(
  x,
  y
) {

  const r =
    player.radius;

  const outer =
    surface.outer;

  if (
    x <
    outer.left +
    outer.thickness +
    r
  ) return true;

  if (
    x >
    outer.right -
    outer.thickness -
    r
  ) return true;

  if (
    y <
    outer.top +
    outer.thickness +
    r
  ) return true;

  if (
    y >
    outer.bottom -
    outer.thickness -
    r
  ) return true;

  const inner =
    surface.inner;

  const wall =
    inner.thickness;

  if (
    x >
    inner.left - r &&
    x <
    inner.right + r &&
    y >
    inner.top - r &&
    y <
    inner.top +
    wall + r
  ) {

    return true;

  }

  if (
    y >
    inner.top - r &&
    y <
    inner.bottom + r &&
    x >
    inner.left - r &&
    x <
    inner.left +
    wall + r
  ) {

    return true;

  }

  if (
    y >
    inner.top - r &&
    y <
    inner.bottom + r &&
    x >
    inner.right -
    wall - r &&
    x <
    inner.right + r
  ) {

    return true;

  }

  if (
    y >
    inner.bottom -
    wall - r &&
    y <
    inner.bottom + r &&
    x >
    inner.left - r &&
    x <
    inner.right + r
  ) {

    const gate =
      x >
      inner.gateX &&
      x <
      inner.gateX +
      inner.gateWidth;

    if (!gate) {

      return true;

    }

  }

  return false;

}

function bunkerCollision(
  x,
  y
) {

  const r =
    player.radius;

  const corridor =
    bunker.corridor;

  const workshop =
    bunker.workshop;

  const inCorridor =

    x >=
    corridor.left + r &&

    x <=
    corridor.right - r &&

    y >=
    corridor.top + r &&

    y <=
    corridor.bottom - r;

  const inWorkshop =

    x >=
    workshop.left + r &&

    x <=
    workshop.right - r &&

    y >=
    workshop.top + r &&

    y <=
    workshop.bottom - r;

  const inDoor =

    x >=
    workshop.right - 30 &&

    x <=
    corridor.left + 30 &&

    y >=
    workshop.doorTop &&

    y <=
    workshop.doorBottom;

  return !(
    inCorridor ||
    inWorkshop ||
    inDoor
  );

}

/* =========================================
   MOVEMENT
========================================= */

function updatePlayer() {

  if (menuOpen) {
    return;
  }

  let x =
    moveX;

  let y =
    moveY;

  let length =
    Math.hypot(
      x,
      y
    );

  if (
    length >
    1
  ) {

    x /= length;
    y /= length;

  }

  let collision =

    scene ===
    "surface"

      ? surfaceCollision
      : bunkerCollision;

  let newX =
    player.x +
    x *
    player.speed;

  let newY =
    player.y +
    y *
    player.speed;

  if (
    !collision(
      newX,
      player.y
    )
  ) {

    player.x =
      newX;

  }

  if (
    !collision(
      player.x,
      newY
    )
  ) {

    player.y =
      newY;

  }

}

/* =========================================
   CAMERA
========================================= */

function updateCamera() {

  let world =

    scene ===
    "surface"

      ? surface
      : bunker;

  camera.x =
    player.x -
    screenWidth / 2;

  camera.y =
    player.y -
    screenHeight / 2;

  camera.x =
    clamp(
      camera.x,
      0,
      Math.max(
        0,
        world.width -
        screenWidth
      )
    );

  camera.y =
    clamp(
      camera.y,
      0,
      Math.max(
        0,
        world.height -
        screenHeight
      )
    );

}

/* =========================================
   ACTION
========================================= */

let currentAction =
  null;

const actionButton =
  el("actionButton");

function distance(
  x1,
  y1,
  x2,
  y2
) {

  return Math.hypot(
    x1 - x2,
    y1 - y2
  );

}

function updateAction() {

  currentAction =
    null;

  let icon =
    "✋";

  if (
    scene ===
    "surface"
  ) {

    if (
      distance(
        player.x,
        player.y,
        surface.hatch.x,
        surface.hatch.y
      ) <
      82
    ) {

      currentAction =
        "bunker";

      icon =
        "↧";

    }

  }

  else {

    if (
      distance(
        player.x,
        player.y,
        bunker.entrance.x,
        bunker.entrance.y
      ) <
      90
    ) {

      currentAction =
        "surface";

      icon =
        "↥";

    }

    if (
      player.x >
      315 &&
      player.x <
      500 &&
      player.y >
      855 &&
      player.y <
      1005
    ) {

      currentAction =
        "workshop";

      icon =
        "🔧";

    }

  }

  actionButton.textContent =
    icon;

  if (
    currentAction
  ) {

    actionButton.classList.add(
      "available"
    );

    actionButton.classList.remove(
      "inactive"
    );

  }

  else {

    actionButton.classList.remove(
      "available"
    );

    actionButton.classList.add(
      "inactive"
    );

  }

}

/* =========================================
   MESSAGE
========================================= */

let messageTimer;

function message(text) {

  const box =
    el("message");

  box.textContent =
    text;

  box.classList.add(
    "show"
  );

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      function() {

        box.classList.remove(
          "show"
        );

      },
      1300
    );

}

/* =========================================
   TRANSITION
========================================= */

function transition(
  title,
  callback
) {

  const fade =
    el("fade");

  fade.textContent =
    title;

  fade.classList.add(
    "show"
  );

  moveX = 0;
  moveY = 0;

  setTimeout(
    function() {

      callback();

      setTimeout(
        function() {

          fade.classList.remove(
            "show"
          );

        },
        260
      );

    },
    400
  );

}

function enterBunker() {

  transition(
    "ПОДЗЕМНАЯ БАЗА",

    function() {

      scene =
        "bunker";

      player.x =
        bunker.entrance.x;

      player.y =
        bunker.entrance.y -
        70;

      bullets.length =
        0;

      el(
        "locationName"
      ).textContent =
        "БУНКЕР";

    }

  );

}

function leaveBunker() {

  transition(
    "ПОВЕРХНОСТЬ",

    function() {

      scene =
        "surface";

      player.x =
        800;

      player.y =
        690;

      bullets.length =
        0;

      el(
        "locationName"
      ).textContent =
        "БАЗА";

    }

  );

}

actionButton.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    if (
      currentAction ===
      "bunker"
    ) {

      enterBunker();

      return;

    }

    if (
      currentAction ===
      "surface"
    ) {

      leaveBunker();

      return;

    }

    if (
      currentAction ===
      "workshop"
    ) {

      openOverlay(
        el(
          "workshopOverlay"
        )
      );

      return;

    }

    message(
      "Здесь пока нет действия"
    );

  }
);

/* =========================================

========================================= */

function drawSurface() {

  ctx.fillStyle =
    "#3c4439";

  ctx.fillRect(
    0,
    0,
    surface.width,
    surface.height
  );

  /* ground */

  for (
    let x = 50;
    x <
    surface.width;
    x += 100
  ) {

    for (
      let y = 50;
      y <
      surface.height;
      y += 100
    ) {

      ctx.fillStyle =
        "rgba(0,0,0,0.035)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        20,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

  }

  /* outer wall */

  const o =
    surface.outer;

  ctx.fillStyle =
    "#5c6260";

  ctx.fillRect(
    o.left,
    o.top,
    o.right -
    o.left,
    o.thickness
  );

  ctx.fillRect(
    o.left,
    o.top,
    o.thickness,
    o.bottom -
    o.top
  );

  ctx.fillRect(
    o.right -
    o.thickness,
    o.top,
    o.thickness,
    o.bottom -
    o.top
  );

  ctx.fillRect(
    o.left,
    o.bottom -
    o.thickness,
    o.right -
    o.left,
    o.thickness
  );

  /* gate */

  ctx.fillStyle =
    "#292d2d";

  ctx.fillRect(
    730,
    o.bottom -
    o.thickness,
    140,
    o.thickness
  );

  /* inner wall */

  const i =
    surface.inner;

  ctx.fillStyle =
    "#6d6d64";

  ctx.fillRect(
    i.left,
    i.top,
    i.right -
    i.left,
    i.thickness
  );

  ctx.fillRect(
    i.left,
    i.top,
    i.thickness,
    i.bottom -
    i.top
  );

  ctx.fillRect(
    i.right -
    i.thickness,
    i.top,
    i.thickness,
    i.bottom -
    i.top
  );

  ctx.fillRect(
    i.left,
    i.bottom -
    i.thickness,
    i.gateX -
    i.left,
    i.thickness
  );

  ctx.fillRect(
    i.gateX +
    i.gateWidth,
    i.bottom -
    i.thickness,
    i.right -
    (
      i.gateX +
      i.gateWidth
    ),
    i.thickness
  );

  /* inside */

  ctx.fillStyle =
    "#57584f";

  ctx.fillRect(
    i.left +
    i.thickness,
    i.top +
    i.thickness,
    i.right -
    i.left -
    i.thickness * 2,
    i.bottom -
    i.top -
    i.thickness * 2
  );

  /* hatch */

  ctx.fillStyle =
    "#17191a";

  ctx.fillRect(
    765,
    555,
    70,
    70
  );

  ctx.strokeStyle =
    "#aaaaaa";

  ctx.lineWidth =
    4;

  ctx.strokeRect(
    765,
    555,
    70,
    70
  );

  ctx.fillStyle =
    "white";

  ctx.font =
    "13px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "ЛЮК",
    800,
    595
  );

  /* farm */

  ctx.fillStyle =
    "#566e42";

  ctx.fillRect(
    300,
    300,
    190,
    120
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "ФЕРМА",
    395,
    365
  );

  /* generator */

  ctx.fillStyle =
    "#454a4d";

  ctx.fillRect(
    1080,
    310,
    125,
    90
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "ГЕНЕРАТОР",
    1142,
    362
  );

  /* car */

  ctx.fillStyle =
    "#38444b";

  ctx.fillRect(
    1100,
    790,
    160,
    75
  );

  ctx.fillStyle =
    "white";

  ctx.fillText(
    "МАШИНА",
    1180,
    833
  );

  /* towers */

  const towers = [

    [200,160],
    [800,150],
    [1400,160],

    [200,1040],
    [800,1040],
    [1400,1040]

  ];

  for (
    let tower of towers
  ) {

    ctx.fillStyle =
      "#282c2d";

    ctx.fillRect(
      tower[0] - 25,
      tower[1] - 25,
      50,
      50
    );

    ctx.fillStyle =
      "#777c7c";

    ctx.fillRect(
      tower[0] - 16,
      tower[1] - 16,
      32,
      32
    );

  }

}

/* =========================================
   DRAW PLAYER
========================================= */

function drawPlayer() {

  let length =
    Math.hypot(
      player.aimX,
      player.aimY
    );

  if (
    length === 0
  ) {

    length = 1;

  }

  let aimX =
    player.aimX /
    length;

  let aimY =
    player.aimY /
    length;

  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,0.30)";

  ctx.beginPath();

  ctx.ellipse(
    player.x,
    player.y + 15,
    17,
    8,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* aim line */

  ctx.strokeStyle =
    "rgba(255,230,160,0.30)";

  ctx.lineWidth =
    1.5;

  ctx.beginPath();

  ctx.moveTo(
    player.x +
    aimX * 24,
    player.y +
    aimY * 24
  );

  ctx.lineTo(
    player.x +
    aimX * 65,
    player.y +
    aimY * 65
  );

  ctx.stroke();

  /* aim dot */

  ctx.strokeStyle =
    "rgba(255,235,175,0.65)";

  ctx.lineWidth =
    1;

  ctx.beginPath();

  ctx.arc(
    player.x +
    aimX * 73,
    player.y +
    aimY * 73,
    4,
    0,
    Math.PI * 2
  );

  ctx.stroke();

  /* body */

  ctx.fillStyle =
    "#405966";

  ctx.fillRect(
    player.x - 10,
    player.y - 5,
    20,
    28
  );

  /* head */

  ctx.fillStyle =
    "#cda780";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y - 12,
    8,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* weapon */

  ctx.strokeStyle =
    "#151719";

  ctx.lineWidth =
    5;

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y
  );

  ctx.lineTo(
    player.x +
    aimX * 27,
    player.y +
    aimY * 27
  );

  ctx.stroke();

}

/* =========================================
   DRAW BULLETS
========================================= */

function drawBullets() {

  for (
    let bullet of bullets
  ) {

    ctx.fillStyle =
      "rgba(255,215,120,0.25)";

    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      8,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle =
      "#ffd778";

    ctx.beginPath();

    ctx.arc(
      bullet.x,
      bullet.y,
      3.5,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

}

/* =========================================
   CONTROL EDITOR
========================================= */

let editingMode =
  "portrait";

let editingLayout =
  clone(
    layouts.portrait
  );

  el("editorStage");

const previews = {

  move:
    el("previewMove"),

  aim:
    el("previewAim"),

  fire:
    el("previewFire"),

  action:
    el("previewAction")

};

function previewPosition(
  element,
  position
) {

  element.style.left =
    position.x *
    100 +
    "%";

  element.style.top =
    position.y *
    100 +
    "%";

}

function renderEditor() {

  previewPosition(
    previews.move,
    editingLayout.move
  );

  previewPosition(
    previews.aim,
    editingLayout.aim
  );

  previewPosition(
    previews.fire,
    editingLayout.fire
  );

  previewPosition(
    previews.action,
    editingLayout.action
  );

}

function switchEditor(
  mode
) {

  editingMode =
    mode;

  editingLayout =
    clone(
      layouts[mode]
    );

  stage.className =
    mode;

  el(
    "portraitTab"
  ).classList.toggle(
    "active",
    mode ===
    "portrait"
  );

  el(
    "landscapeTab"
  ).classList.toggle(
    "active",
    mode ===
    "landscape"
  );

  renderEditor();

}

el(
  "portraitTab"
).addEventListener(
  "click",
  function() {

    switchEditor(
      "portrait"
    );

  }
);

el(
  "landscapeTab"
).addEventListener(
  "click",
  function() {

    switchEditor(
      "landscape"
    );

  }
);

function draggable(
  element,
  key
) {

  let pointer =
    null;

  function update(e) {

    const rect =
      stage.getBoundingClientRect();

    let x =
      (
        e.clientX -
        rect.left
      ) /
      rect.width;

    let y =
      (
        e.clientY -
        rect.top
      ) /
      rect.height;

    let margin =

      key ===
      "move" ||

      key ===
      "aim"

        ? 0.09
        : 0.06;

    x =
      clamp(
        x,
        margin,
        1 - margin
      );

    y =
      clamp(
        y,
        margin,
        1 - margin
      );

    editingLayout[key] = {
      x: x,
      y: y
    };

    previewPosition(
      element,
      editingLayout[key]
    );

  }

  element.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      pointer =
        e.pointerId;

      element.classList.add(
        "dragging"
      );

      try {

        element.setPointerCapture(
          e.pointerId
        );

      }

      catch (error) {}

      update(e);

    }
  );

  element.addEventListener(
    "pointermove",
    function(e) {

      if (
        e.pointerId !==
        pointer
      ) {

        return;

      }

      update(e);

    }
  );

  function stop() {

    pointer =
      null;

    element.classList.remove(
      "dragging"
    );

  }

  element.addEventListener(
    "pointerup",
    stop
  );

  element.addEventListener(
    "pointercancel",
    stop
  );

}

draggable(
  previews.move,
  "move"
);

draggable(
  previews.aim,
  "aim"
);

draggable(
  previews.fire,
  "fire"
);

draggable(
  previews.action,
  "action"
);

el(
  "openControlSettings"
).addEventListener(
  "click",
  function() {

    closeOverlay(
      el(
        "settingsOverlay"
      )
    );

    editingMode =
      orientation();

    editingLayout =
      clone(
        layouts[
          editingMode
        ]
      );

    stage.className =
      editingMode;

    el(
      "portraitTab"
    ).classList.toggle(
      "active",
      editingMode ===
      "portrait"
    );

    el(
      "landscapeTab"
    ).classList.toggle(
      "active",
      editingMode ===
      "landscape"
    );

    renderEditor();

    openOverlay(
      el(
        "controlOverlay"
      )
    );

  }
);

el(
  "saveControls"
).addEventListener(
  "click",
  function() {

    layouts[
      editingMode
    ] =
      clone(
        editingLayout
      );

    try {

      localStorage.setItem(
        "base_controls_031",
        JSON.stringify(
          layouts
        )
      );

    }

    catch (error) {}

    applyControls();

    message(
      "Управление сохранено"
    );

  }
);

el(
  "resetControls"
).addEventListener(
  "click",
  function() {

    layouts[
      editingMode
    ] =
      clone(
        defaults[
          editingMode
        ]
      );

    editingLayout =
      clone(
        defaults[
          editingMode
        ]
      );

    try {

      localStorage.setItem(
        "base_controls_031",
        JSON.stringify(
          layouts
        )
      );

    }

    catch (error) {}

    renderEditor();

    applyControls();

    message(
      "Раскладка сброшена"
    );

  }
);

el(
  "backControls"
).addEventListener(
  "click",
  function() {

    closeOverlay(
      el(
        "controlOverlay"
      )
    );

    openOverlay(
      el(
        "settingsOverlay"
      )
    );

  }
);

/* =========================================
   SCREEN CHANGES
========================================= */

window.addEventListener(
  "resize",
  function() {

    resizeCanvas();

    applyControls();

  }
);

window.addEventListener(
  "orientationchange",
  function() {

    setTimeout(
      function() {

        resizeCanvas();

        applyControls();

      },
      150
    );

  }
);

/* =========================================
   PREVENT SWIPE
========================================= */

document.addEventListener(
  "touchmove",
  function(e) {

    if (
      !e.target.closest(
        ".panel"
      )
    ) {

      e.preventDefault();

    }

  },
  {
    passive: false
  }
);

/* =========================================
   GAME LOOP
========================================= */

function update() {

  updatePlayer();

  updateBullets();

  updateAction();

  updateCamera();

}

function draw() {

  ctx.clearRect(
    0,
    0,
    screenWidth,
    screenHeight
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );

  if (
    scene ===
    "surface"
  ) {

    drawSurface();

  }

  else {

    drawBunker();

  }

  drawBullets();

  drawPlayer();

  ctx.restore();

}

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(
    gameLoop
  );

}

/* =========================================
   START
========================================= */

/*
  ВАЖНО:
  layouts уже создан выше.
  Только теперь запускаем canvas.
*/

resizeCanvas();

applyControls();

updateCamera();

gameLoop();

/*
  Fullscreen запускаем ПОСЛЕ игры,
  поэтому даже ошибка Telegram fullscreen
  не может остановить Canvas.
*/

setTimeout(
  fullscreen,
  400
);

</script>
