<style>

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;

}

html,
body {
  margin: 0;

  height: 100%;

  overflow: hidden;

  touch-action: none;
  overscroll-behavior: none;

/* =========================
   HUD
========================= */

  top: calc(10px + env(safe-area-inset-top));

  border-radius: 12px;

  font-size: 12px;
}

  font-size: 15px;
}

/* =========================
   JOYSTICKS
========================= */

.joystickZone {
  position: absolute;

  width: 120px;
  height: 120px;

  z-index: 20;

  touch-action: none;

  left: 18px;

#aimZone {
  right: 18px;
}

  border-radius: 50%;

  background: rgba(15,20,25,.68);

}

.joystickStick {
  position: absolute;

  width: 48px;
  height: 48px;

  left: 36px;
  top: 36px;

  border-radius: 50%;

  background: rgba(235,235,235,.88);

  border: 2px solid white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;

  pointer-events: none;

  transform: translate(0,0);
}

/* =========================
   ACTION BUTTON
========================= */

#actionButton {
  position: absolute;

  right: 22px;

  bottom:
    calc(
      145px +
      env(safe-area-inset-bottom)
    );

  width: 74px;
  height: 74px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.15);

  background: rgba(38,106,210,.92);

  color: white;

  font-size: 13px;
  font-weight: bold;

  z-index: 20;

  touch-action: manipulation;

  box-shadow: 0 0 20px rgba(45,120,255,.25);
}

#actionButton:active {
  transform: scale(.94);
}

/* =========================
   MESSAGE
========================= */

#message {
  position: absolute;

  left: 50%;
  bottom: calc(165px + env(safe-area-inset-bottom));

  transform: translateX(-50%);

  z-index: 50;

  padding: 10px 15px;

  border-radius: 12px;

  color: white;

  background: rgba(0,0,0,.84);

  border: 1px solid rgba(255,255,255,.13);

  white-space: nowrap;

  opacity: 0;

  transition: opacity .2s;

  pointer-events: none;
}

#message.show {
  opacity: 1;
}

/* =========================
   FADE / LOADING
========================= */

#fade {
  position: absolute;

  inset: 0;

  background: black;

  z-index: 100;

  opacity: 0;

  pointer-events: none;

  transition: opacity .35s;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 19px;
  letter-spacing: 2px;
}

#fade.show {
  opacity: 1;
}

/* =========================
   WORKSHOP PANEL
========================= */

#workshopPanel {
  position: absolute;

  inset: 0;

  z-index: 120;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,.75);

  padding: 24px;
}

#workshopBox {
  width: min(430px, 92vw);

  background: #14191d;

  border: 1px solid rgba(255,255,255,.16);

  border-radius: 20px;

  padding: 22px;

  color: white;

  box-shadow: 0 25px 80px rgba(0,0,0,.6);
}

#workshopBox h2 {
  margin: 0 0 8px;
}

#workshopBox p {
  color: #aaa;

  line-height: 1.5;

  margin-bottom: 18px;
}

.workshopItem {
  padding: 14px;

  margin-top: 9px;

  border-radius: 12px;

  background: #20272c;

  border: 1px solid rgba(255,255,255,.07);

  color: #bbb;
}

#closeWorkshop {
  margin-top: 18px;

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 12px;

  background: #2d70d8;

  color: white;

  font-size: 15px;
  font-weight: bold;
}

</style>

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram?.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

  if (
    typeof tg.disableVerticalSwipes
    === "function"
  ) {

    tg.disableVerticalSwipes();

  }

}

/* =====================================================
   PREVENT PAGE MOVEMENT
===================================================== */

document.addEventListener(
  "touchmove",
  e => e.preventDefault(),
  { passive:false }
);

/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let screenW = 0;
let screenH = 0;

function resize() {

  const ratio =
    window.devicePixelRatio || 1;

  screenW =
    window.innerWidth;

  screenH =
    window.innerHeight;

  canvas.width =
    screenW * ratio;

  canvas.height =
    screenH * ratio;

  canvas.style.width =
    screenW + "px";

  canvas.style.height =
    screenH + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

}

resize();

window.addEventListener(
  "resize",
  resize
);

/* =====================================================
   GAME STATE
===================================================== */

let scene =
  "surface";

const player = {

  x: 800,
  y: 860,

  radius: 17,

  speed: 4,

  aimX: 0,
  aimY: -1

};

const camera = {
  x:0,
  y:0
};

/* =====================================================
   INPUT
===================================================== */

let moveX = 0;
let moveY = 0;

let aimX = 0;
let aimY = 0;

let firing = false;

/* =====================================================
   JOYSTICK CREATOR
===================================================== */

function setupJoystick(
  zone,
  stick,
  callback,
  releaseCallback
) {

  let activePointer = null;

  const max = 34;

  function update(e) {

    const rect =
      zone.getBoundingClientRect();

    const cx =
      rect.left +
      rect.width / 2;

    const cy =
      rect.top +
      rect.height / 2;

    let dx =
      e.clientX - cx;

    let dy =
      e.clientY - cy;

    const dist =
      Math.hypot(dx,dy);

    if (dist > max) {

      dx =
        dx / dist * max;

      dy =
        dy / dist * max;

    }

    stick.style.transform =
      `translate(${dx}px,${dy}px)`;

    callback(
      dx / max,
      dy / max
    );

  }

  function stop(e) {

    if (
      activePointer !== null &&
      e.pointerId !== undefined &&
      e.pointerId !== activePointer
    ) {

      return;

    }

    activePointer = null;

    stick.style.transform =
      "translate(0px,0px)";

    callback(0,0);

    if (releaseCallback) {
      releaseCallback();
    }

  }

  zone.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      activePointer =
        e.pointerId;

      try {
        zone.setPointerCapture(
          e.pointerId
        );
      } catch(err) {}

      update(e);

    }
  );

  zone.addEventListener(
    "pointermove",
    e => {

      if (
        e.pointerId !==
        activePointer
      ) return;

      e.preventDefault();

      update(e);

    }
  );

  zone.addEventListener(
    "pointerup",
    stop
  );

  zone.addEventListener(
    "pointercancel",
    stop
  );

}

/* =====================================================
   LEFT JOYSTICK
===================================================== */

setupJoystick(

  document.getElementById(
    "moveZone"
  ),

  document.getElementById(
    "moveStick"
  ),

  (x,y) => {

    moveX = x;
    moveY = y;

  }

);

/* =====================================================
   RIGHT JOYSTICK
===================================================== */

setupJoystick(

  document.getElementById(
    "aimZone"
  ),

  document.getElementById(
    "aimStick"
  ),

  (x,y) => {

    aimX = x;
    aimY = y;

    const power =
      Math.hypot(x,y);

    if (power > .18) {

      player.aimX = x;
      player.aimY = y;

      firing = true;

    } else {

      firing = false;

    }

  },

  () => {

    firing = false;

  }

);

/* =====================================================
   BULLETS
===================================================== */

const bullets = [];

let lastShot = 0;

function shoot() {

  const now =
    performance.now();

  if (
    now - lastShot < 220
  ) return;

  lastShot = now;

  const mag =
    Math.hypot(
      player.aimX,
      player.aimY
    ) || 1;

  const dx =
    player.aimX / mag;

  const dy =
    player.aimY / mag;

  bullets.push({

    x:
      player.x +
      dx * 25,

    y:
      player.y +
      dy * 25,

    dx:
      dx * 10,

    dy:
      dy * 10,

    life:70

  });

}

function updateBullets() {

  if (firing) {

    shoot();

  }

  for (
    let i =
      bullets.length - 1;

    i >= 0;

    i--
  ) {

    const b =
      bullets[i];

    b.x += b.dx;
    b.y += b.dy;

    b.life--;

    if (
      b.life <= 0
    ) {

      bullets.splice(i,1);

    }

  }

}

/* =====================================================
   SURFACE MAP
===================================================== */

const surface = {

  width:1600,
  height:1200,

  outer: {

    left:170,
    top:130,
    right:1430,
    bottom:1070,

    thickness:45

  },

  mainGate: {

    x:730,
    width:140,
    open:false

  },

  inner: {

    left:610,
    top:420,
    right:990,
    bottom:760,

    thickness:28,

    gateX:750,
    gateWidth:100

  },

  hatch: {

    x:800,
    y:590

  }

};

/* =====================================================
   UNDERGROUND MAP
===================================================== */

const underground = {

  width:1450,
  height:1450,

  corridorLeft:610,
  corridorRight:840,

  corridorTop:200,
  corridorBottom:1260,

  entrance: {

    x:725,
    y:1180

  },

  workshop: {

    x:250,
    y:850,

    w:360,
    h:270,

    doorY:950

  }

};

/* =====================================================
   ROOM DATA
===================================================== */

const roomDoors = [

  {
    side:"left",
    y:950,
    name:"МАСТЕРСКАЯ",
    open:true
  },

  {
    side:"left",
    y:700,
    name:"МЕДИЦИНА",
    open:false
  },

  {
    side:"left",
    y:450,
    name:"СКЛАД",
    open:false
  },

  {
    side:"right",
    y:950,
    name:"ОТДЫХ",
    open:false
  },

  {
    side:"right",
    y:700,
    name:"ЭНЕРГЕТИКА",
    open:false
  },

  {
    side:"right",
    y:450,
    name:"ОБОРОНА",
    open:false
  }

];

/* =====================================================
   FARM ROOM
===================================================== */

const farmRoom = {

  x:430,
  y:40,

  w:590,
  h:300

};

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text) {

  const el =
    document.getElementById(
      "message"
    );

  el.textContent = text;

  el.classList.add(
    "show"
  );

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      () =>
        el.classList.remove(
          "show"
        ),
      1400
    );

}

/* =====================================================
   TRANSITION
===================================================== */

function transition(
  label,
  callback
) {

  const fade =
    document.getElementById(
      "fade"
    );

  fade.textContent =
    label;

  fade.classList.add(
    "show"
  );

  setTimeout(
    () => {

      callback();

      setTimeout(
        () => {

          fade.classList.remove(
            "show"
          );

        },
        250
      );

    },
    420
  );

}

/* =====================================================
   ENTER BUNKER
===================================================== */

function enterUnderground() {

  transition(
    "ПОДЗЕМНАЯ БАЗА",
    () => {

      scene =
        "underground";

      player.x =
        underground.entrance.x;

      player.y =
        underground.entrance.y;

      bullets.length = 0;

      document.getElementById(
        "locationName"
      ).textContent =
        "БУНКЕР";

    }
  );

}

/* =====================================================
   RETURN SURFACE
===================================================== */

function returnSurface() {

  transition(
    "ПОВЕРХНОСТЬ",
    () => {

      scene =
        "surface";

      player.x =
        800;

      player.y =
        665;

      bullets.length = 0;

      document.getElementById(
        "locationName"
      ).textContent =
        "БАЗА";

    }
  );

}

/* =====================================================
   ACTION BUTTON
===================================================== */

document.getElementById(
  "actionButton"
).addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    action();

  }
);

/* =====================================================
   ACTION LOGIC
===================================================== */

function action() {

  if (
    scene === "surface"
  ) {

    const h =
      surface.hatch;

    if (
      Math.hypot(
        player.x - h.x,
        player.y - h.y
      ) < 80
    ) {

      enterUnderground();

      return;

    }

    showMessage(
      "Здесь пока нечего делать"
    );

  }

  else {

    /* ladder */

    if (
      Math.hypot(
        player.x -
        underground.entrance.x,

        player.y -
        underground.entrance.y
      ) < 80
    ) {

      returnSurface();

      return;

    }

    /* workshop bench */

    if (
      player.x > 320 &&
      player.x < 500 &&
      player.y > 870 &&
      player.y < 1030
    ) {

      document.getElementById(
        "workshopPanel"
      ).style.display =
        "flex";

      return;

    }

    showMessage(
      "Нет доступного действия"
    );

  }

}

/* =====================================================
   CLOSE WORKSHOP
===================================================== */

document.getElementById(
  "closeWorkshop"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "workshopPanel"
    ).style.display =
      "none";

  }
);

/* =====================================================
   COLLISION SURFACE
===================================================== */

function surfaceCollision(
  x,
  y
) {

  const r =
    player.radius;

  const o =
    surface.outer;

  const gate =
    surface.mainGate;

  if (
    x < o.left + r ||
    x > o.right - r ||
    y < o.top + r
  ) {

    return true;

  }

  if (
    y >
    o.bottom - r
  ) {

    const inGate =
      x >
      gate.x &&
      x <
      gate.x +
      gate.width;

    if (
      !(
        inGate &&
        gate.open
      )
    ) {

      return true;

    }

  }

  /* inner wall */

  const inner =
    surface.inner;

  const nearTop =
    Math.abs(
      y -
      inner.top
    ) <
    inner.thickness +
    r;

  const nearBottom =
    Math.abs(
      y -
      inner.bottom
    ) <
    inner.thickness +
    r;

  const withinX =
    x >
    inner.left &&
    x <
    inner.right;

  if (
    withinX &&
    nearTop
  ) {

    return true;

  }

  if (
    withinX &&
    nearBottom
  ) {

    const insideDoor =
      x >
      inner.gateX &&
      x <
      inner.gateX +
      inner.gateWidth;

    if (
      !insideDoor
    ) {

      return true;

    }

  }

  const withinY =
    y >
    inner.top &&
    y <
    inner.bottom;

  if (
    withinY &&
    (
      Math.abs(
        x-inner.left
      ) <
      inner.thickness+r
      ||
      Math.abs(
        x-inner.right
      ) <
      inner.thickness+r
    )
  ) {

    return true;

  }

  return false;

}

/* =====================================================
   COLLISION UNDERGROUND
===================================================== */

function undergroundCollision(
  x,
  y
) {

  const r =
    player.radius;

  /* outside whole bunker */

  if (
    x < 220 ||
    x > 1230 ||
    y < 40 ||
    y > 1280
  ) {

    return true;

  }

  const left =
    underground.corridorLeft;

  const right =
    underground.corridorRight;

  /*
    corridor walls except doors
  */

  if (
    x <
    left + r
  ) {

    let allowed = false;

    /* workshop opening */

    if (
      y > 890 &&
      y < 1010
    ) {

      allowed = true;

    }

    if (!allowed) {

      if (
        x >
        left - 35
      ) {

        return true;

      }

    }

  }

  if (
    x >
    right - r
  ) {

    if (
      x <
      right + 35
    ) {

      return true;

    }

  }

  /* workshop outer bounds */

  const w =
    underground.workshop;

  if (
    x > w.x &&
    x < w.x + w.w &&
    y > w.y &&
    y < w.y + w.h
  ) {

    return false;

  }

  /*
    prevent roaming into
    locked room spaces
  */

  if (
    x < left &&
    !(
      x > w.x &&
      x < w.x + w.w &&
      y > w.y &&
      y < w.y + w.h
    )
  ) {

    return true;

  }

  if (
    x > right
  ) {

    return true;

  }

  return false;

}

/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer() {

  let mx =
    moveX;

  let my =
    moveY;

  const mag =
    Math.hypot(mx,my);

  if (
    mag > 1
  ) {

    mx /= mag;
    my /= mag;

  }

  const nx =
    player.x +
    mx *
    player.speed;

  const ny =
    player.y +
    my *
    player.speed;

  const collision =
    scene === "surface"
    ? surfaceCollision
    : undergroundCollision;

  if (
    !collision(
      nx,
      player.y
    )
  ) {

    player.x =
      nx;

  }

  if (
    !collision(
      player.x,
      ny
    )
  ) {

    player.y =
      ny;

  }

}

/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

  const world =
    scene === "surface"
    ? surface
    : underground;

  camera.x =
    player.x -
    screenW / 2;

  camera.y =
    player.y -
    screenH / 2;

  camera.x =
    Math.max(
      0,
      Math.min(
        camera.x,
        world.width -
        screenW
      )
    );

  camera.y =
    Math.max(
      0,
      Math.min(
        camera.y,
        world.height -
        screenH
      )
    );

}

/* =====================================================
   DRAW SURFACE
===================================================== */

function drawSurface() {

  ctx.fillStyle =
    "#3c4439";

  ctx.fillRect(
    0,
    0,
    surface.width,
    surface.height
  );

  /* ground variation */

  for (
    let x = 50;
    x < 1600;
    x += 100
  ) {

    for (
      let y = 50;
      y < 1200;
      y += 100
    ) {

      ctx.fillStyle =
        "rgba(0,0,0,.06)";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        22,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

  const o =
    surface.outer;

  ctx.fillStyle =
    "#5b5f5d";

  /* top */

  ctx.fillRect(
    o.left,
    o.top,
    o.right-o.left,
    o.thickness
  );

  /* left */

  ctx.fillRect(
    o.left,
    o.top,
    o.thickness,
    o.bottom-o.top
  );

  /* right */

  ctx.fillRect(
    o.right-o.thickness,
    o.top,
    o.thickness,
    o.bottom-o.top
  );

  /* bottom */

  ctx.fillRect(
    o.left,
    o.bottom-o.thickness,
    o.right-o.left,
    o.thickness
  );

  /* inner compound */

  const inner =
    surface.inner;

  ctx.fillStyle =
    "#6b6b62";

  ctx.fillRect(
    inner.left,
    inner.top,
    inner.right-inner.left,
    inner.thickness
  );

  ctx.fillRect(
    inner.left,
    inner.top,
    inner.thickness,
    inner.bottom-inner.top
  );

  ctx.fillRect(
    inner.right-inner.thickness,
    inner.top,
    inner.thickness,
    inner.bottom-inner.top
  );

  /* bottom left */

  ctx.fillRect(
    inner.left,
    inner.bottom-inner.thickness,
    inner.gateX-inner.left,
    inner.thickness
  );

  /* bottom right */

  ctx.fillRect(
    inner.gateX+
    inner.gateWidth,

    inner.bottom-
    inner.thickness,

    inner.right-
    (
      inner.gateX+
      inner.gateWidth
    ),

    inner.thickness
  );

  /* inner floor */

  ctx.fillStyle =
    "#59594f";

  ctx.fillRect(
    inner.left+
    inner.thickness,

    inner.top+
    inner.thickness,

    inner.right-
    inner.left-
    inner.thickness*2,

    inner.bottom-
    inner.top-
    inner.thickness*2
  );

  /* hatch */

  const h =
    surface.hatch;

  ctx.fillStyle =
    "#17191a";

  ctx.fillRect(
    h.x-35,
    h.y-35,
    70,
    70
  );

  ctx.strokeStyle =
    "#a0a0a0";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    h.x-35,
    h.y-35,
    70,
    70
  );

  ctx.fillStyle =
    "#ccc";

  ctx.textAlign =
    "center";

  ctx.font =
    "14px Arial";

  ctx.fillText(
    "ЛЮК",
    h.x,
    h.y+5
  );

  /* towers */

  const towerPoints = [

    [200,160],
    [800,150],
    [1400,160],

    [200,1040],
    [800,1045],
    [1400,1040]

  ];

  for (
    const t of towerPoints
  ) {

    ctx.fillStyle =
      "#282c2d";

    ctx.fillRect(
      t[0]-25,
      t[1]-25,
      50,
      50
    );

    ctx.fillStyle =
      "#73797a";

    ctx.fillRect(
      t[0]-17,
      t[1]-17,
      34,
      34
    );

  }

}

/* =====================================================
   DRAW UNDERGROUND
===================================================== */

function drawUnderground() {

  ctx.fillStyle =
    "#111519";

  ctx.fillRect(
    0,
    0,
    underground.width,
    underground.height
  );

  /* corridor */

  ctx.fillStyle =
    "#3d4143";

  ctx.fillRect(
    underground.corridorLeft,
    underground.corridorTop,
    underground.corridorRight-
    underground.corridorLeft,
    underground.corridorBottom-
    underground.corridorTop
  );

  /* corridor center line */

  ctx.strokeStyle =
    "rgba(255,255,255,.08)";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    725,
    220
  );

  ctx.lineTo(
    725,
    1240
  );

  ctx.stroke();

  /* walls */

  ctx.fillStyle =
    "#777a79";

  ctx.fillRect(
    590,
    200,
    20,
    1060
  );

  ctx.fillRect(
    840,
    200,
    20,
    1060
  );

  /* workshop */

  const w =
    underground.workshop;

  ctx.fillStyle =
    "#343a3c";

  ctx.fillRect(
    w.x,
    w.y,
    w.w,
    w.h
  );

  ctx.strokeStyle =
    "#777";

  ctx.lineWidth = 18;

  ctx.strokeRect(
    w.x,
    w.y,
    w.w,
    w.h
  );

  /* workshop door gap */

  ctx.fillStyle =
    "#343a3c";

  ctx.fillRect(
    590,
    900,
    30,
    110
  );

  /* workshop bench */

  ctx.fillStyle =
    "#704f2f";

  ctx.fillRect(
    330,
    890,
    145,
    55
  );

  ctx.fillStyle =
    "#999";

  ctx.fillRect(
    345,
    850,
    115,
    45
  );

  ctx.fillStyle =
    "#ddd";

  ctx.font =
    "15px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "ВЕРСТАК",
    402,
    880
  );

  /* locked rooms */

  for (
    const room of roomDoors
  ) {

    const doorX =
      room.side === "left"
      ? 590
      : 840;

    ctx.fillStyle =
      room.open
      ? "#5a5f5f"
      : "#232729";

    ctx.fillRect(
      doorX-8,
      room.y-50,
      36,
      100
    );

    ctx.fillStyle =
      "#d0d0d0";

    ctx.font =
      "13px Arial";

    ctx.textAlign =
      room.side === "left"
      ? "right"
      : "left";

    ctx.fillText(
      room.name,
      room.side === "left"
      ? 570
      : 880,
      room.y+5
    );

  }

  /* large farm room */

  ctx.fillStyle =
    "#28352c";

  ctx.fillRect(
    farmRoom.x,
    farmRoom.y,
    farmRoom.w,
    farmRoom.h
  );

  ctx.strokeStyle =
    "#777";

  ctx.lineWidth = 20;

  ctx.strokeRect(
    farmRoom.x,
    farmRoom.y,
    farmRoom.w,
    farmRoom.h
  );

  ctx.fillStyle =
    "#9cc390";

  ctx.font =
    "20px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "🌱 БУДУЩАЯ ФЕРМА",
    725,
    100
  );

  /* entrance ladder */

  ctx.fillStyle =
    "#17191a";

  ctx.fillRect(
    690,
    1150,
    70,
    70
  );

  ctx.strokeStyle =
    "#aaa";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    690,
    1150,
    70,
    70
  );

  ctx.fillStyle =
    "#ddd";

  ctx.font =
    "13px Arial";

  ctx.fillText(
    "ВЫХОД",
    725,
    1192
  );

}

/* =====================================================
   DRAW BULLETS
===================================================== */

function drawBullets() {

  ctx.fillStyle =
    "#ffd66b";

  for (
    const b of bullets
  ) {

    ctx.beginPath();

    ctx.arc(
      b.x,
      b.y,
      4,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}

/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer() {

  /* shadow */

  ctx.fillStyle =
    "rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    player.x,
    player.y+15,
    17,
    8,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* aiming line */

  const mag =
    Math.hypot(
      player.aimX,
      player.aimY
    ) || 1;

  const ax =
    player.aimX / mag;

  const ay =
    player.aimY / mag;

  ctx.strokeStyle =
    "rgba(255,225,130,.55)";

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y
  );

  ctx.lineTo(
    player.x+
    ax*70,

    player.y+
    ay*70
  );

  ctx.stroke();

  /* body */

  ctx.fillStyle =
    "#3f5867";

  ctx.fillRect(
    player.x-10,
    player.y-5,
    20,
    28
  );

  /* head */

  ctx.fillStyle =
    "#d0aa83";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y-12,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* weapon */

  ctx.strokeStyle =
    "#151719";

  ctx.lineWidth = 5;

  ctx.beginPath();

  ctx.moveTo(
    player.x,
    player.y
  );

  ctx.lineTo(
    player.x+
    ax*26,

    player.y+
    ay*26
  );

  ctx.stroke();

}

/* =====================================================
   GAME UPDATE
===================================================== */

function update() {

  updatePlayer();

  updateBullets();

  updateCamera();

}

/* =====================================================
   GAME DRAW
===================================================== */

function draw() {

  ctx.clearRect(
    0,
    0,
    screenW,
    screenH
  );

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );

  if (
    scene === "surface"
  ) {

    drawSurface();

  }

  else {

    drawUnderground();

  }

  drawBullets();

  drawPlayer();

  ctx.restore();

}

/* =====================================================
   LOOP
===================================================== */

function loop() {

  update();

  draw();

  requestAnimationFrame(
    loop
  );

}

loop();

</script>
