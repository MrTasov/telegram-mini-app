<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Survival Base</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  background: #080b0d;
  color: white;
  overflow: hidden;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  background: #111;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* HUD */

.hud {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
}

.hudBox {
  background: rgba(5,10,14,.75);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 13px;
}

.hud strong {
  font-size: 16px;
}

/* JOYSTICK */

#joystickZone {
  position: absolute;
  left: 22px;
  bottom: 28px;
  width: 150px;
  height: 150px;
  touch-action: none;
}

#joystickBase {
  position: absolute;
  width: 130px;
  height: 130px;
  left: 10px;
  top: 10px;

  border-radius: 50%;
  background: rgba(15,25,32,.65);
  border: 2px solid rgba(255,255,255,.18);
  backdrop-filter: blur(8px);
}

#joystickStick {
  position: absolute;
  width: 62px;
  height: 62px;

  left: 44px;
  top: 44px;

  border-radius: 50%;
  background: rgba(235,235,235,.8);
  border: 2px solid white;

  transform: translate(0px,0px);
}

/* ACTION BUTTON */

#actionButton {
  position: absolute;
  right: 24px;
  bottom: 48px;

  width: 105px;
  height: 105px;

  border: none;
  border-radius: 50%;

  background: rgba(36,110,220,.9);
  color: white;

  font-weight: bold;
  font-size: 15px;

  box-shadow: 0 0 25px rgba(50,120,255,.25);
}

#actionButton:active {
  transform: scale(.95);
}

/* POPUP */

#message {
  position: absolute;
  left: 50%;
  bottom: 190px;
  transform: translateX(-50%);

  padding: 12px 18px;
  border-radius: 14px;

  background: rgba(0,0,0,.8);
  border: 1px solid rgba(255,255,255,.15);

  font-size: 14px;
  opacity: 0;

  transition: opacity .2s;
  pointer-events: none;
}

#message.show {
  opacity: 1;
}

/* HATCH SCREEN */

#underground {
  position: absolute;
  inset: 0;

  background: #090d12;

  display: none;
  align-items: center;
  justify-content: center;

  flex-direction: column;

  z-index: 20;
}

#underground h1 {
  margin-bottom: 10px;
}

#underground p {
  color: #aaa;
}

#underground button {
  margin-top: 20px;

  border: none;
  border-radius: 14px;

  padding: 15px 25px;

  background: #246dde;
  color: white;

  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div class="hud">
  <div class="hudBox">
    <strong>ДЕНЬ 1</strong><br>
    14:32
  </div>

  <div class="hudBox">
    ❤️ 100
    &nbsp;&nbsp;
    🍖 100
  </div>
</div>

<div id="joystickZone">
  <div id="joystickBase"></div>
  <div id="joystickStick"></div>
</div>

<button id="actionButton">
  ДЕЙСТВИЕ
</button>

<div id="message"></div>

<div id="underground">
  <h1>⬇ ПОДЗЕМНАЯ БАЗА</h1>
  <p>Позже здесь будут комнаты, склад, мастерская и медицина.</p>

  <button onclick="closeUnderground()">
    Вернуться наверх
  </button>
</div>

</div>


<script>

/* TELEGRAM */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* CANVAS */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let screenW = 0;
let screenH = 0;

function resize() {

  const ratio = window.devicePixelRatio || 1;

  screenW = window.innerWidth;
  screenH = window.innerHeight;

  canvas.width = screenW * ratio;
  canvas.height = screenH * ratio;

  canvas.style.width = screenW + "px";
  canvas.style.height = screenH + "px";

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

window.addEventListener("resize", resize);

resize();


/* WORLD */

const world = {
  width: 1600,
  height: 1200
};


/* PLAYER */

const player = {

  x: 800,
  y: 850,

  radius: 18,

  speed: 3.8
};


/* CAMERA */

const camera = {
  x: 0,
  y: 0
};


/* OUTER BASE */

const outer = {

  left: 170,
  top: 130,

  right: 1430,
  bottom: 1070,

  thickness: 45
};


/* MAIN GATE */

const gate = {

  x: 730,
  y: outer.bottom - outer.thickness,

  width: 140,

  open: false
};


/* INNER COMPOUND */

const inner = {

  left: 610,
  top: 420,

  right: 990,
  bottom: 760,

  thickness: 28,

  gateWidth: 90
};


/* HATCH */

const hatch = {

  x: 800,
  y: 590,

  radius: 35
};


/* WORLD OBJECTS */

const objects = [

  {
    type: "farm",
    x: 290,
    y: 650,
    w: 200,
    h: 180
  },

  {
    type: "generator",
    x: 1120,
    y: 300,
    w: 110,
    h: 80
  },

  {
    type: "car",
    x: 1150,
    y: 780,
    w: 120,
    h: 65
  },

  {
    type: "water",
    x: 350,
    y: 320,
    w: 70,
    h: 70
  }
];


/* TOWERS */

const towers = [

  [200,160],
  [480,145],
  [800,145],
  [1120,145],
  [1400,160],

  [200,1040],
  [480,1055],
  [800,1055],
  [1120,1055],
  [1400,1040],

  [190,420],
  [190,760],

  [1410,420],
  [1410,760]
];


/* MOVEMENT */

let moveX = 0;
let moveY = 0;


/* JOYSTICK */

const zone =
  document.getElementById("joystickZone");

const stick =
  document.getElementById("joystickStick");


let activePointer = null;


zone.addEventListener("pointerdown", e => {

  activePointer = e.pointerId;

  zone.setPointerCapture(e.pointerId);

  updateJoystick(e);
});


zone.addEventListener("pointermove", e => {

  if (e.pointerId !== activePointer)
    return;

  updateJoystick(e);
});


zone.addEventListener("pointerup", e => {

  if (e.pointerId !== activePointer)
    return;

  activePointer = null;

  moveX = 0;
  moveY = 0;

  stick.style.transform =
    "translate(0px,0px)";
});


function updateJoystick(e) {

  const rect =
    zone.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const centerY =
    rect.top + rect.height / 2;

  let dx =
    e.clientX - centerX;

  let dy =
    e.clientY - centerY;

  const max = 42;

  const dist =
    Math.sqrt(dx*dx + dy*dy);

  if (dist > max) {

    dx =
      dx / dist * max;

    dy =
      dy / dist * max;
  }

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;

  moveX = dx / max;
  moveY = dy / max;
}


/* COLLISIONS */

function pointInRect(x,y,rect) {

  return (
    x > rect.x &&
    x < rect.x + rect.w &&
    y > rect.y &&
    y < rect.y + rect.h
  );
}


function collision(x,y) {

  const r = player.radius;


  /* WORLD BORDER */

  if (
    x < outer.left + r ||
    x > outer.right - r ||
    y < outer.top + r ||
    y > outer.bottom - r
  ) {

    /* GATE OPENING */

    const atGate =
      x > gate.x &&
      x < gate.x + gate.width &&
      y > outer.bottom - 80;

    if (
      atGate &&
      gate.open
    ) {

      return false;
    }

    return true;
  }


  /* INNER WALL */

  const withinInnerX =
    x > inner.left &&
    x < inner.right;

  const withinInnerY =
    y > inner.top &&
    y < inner.bottom;


  if (
    withinInnerX &&
    (
      Math.abs(
        y - inner.top
      ) <
      inner.thickness + r ||

      Math.abs(
        y - inner.bottom
      ) <
      inner.thickness + r
    )
  ) {

    return true;
  }


  if (
    withinInnerY &&
    (
      Math.abs(
        x - inner.left
      ) <
      inner.thickness + r ||

      Math.abs(
        x - inner.right
      ) <
      inner.thickness + r
    )
  ) {

    return true;
  }


  /* OBJECTS */

  for (const obj of objects) {

    const rect = {

      x: obj.x - r,
      y: obj.y - r,

      w: obj.w + r*2,
      h: obj.h + r*2
    };

    if (
      pointInRect(
        x,
        y,
        rect
      )
    ) {

      return true;
    }
  }


  return false;
}


/* ACTION */

const actionButton =
  document.getElementById("actionButton");


actionButton.addEventListener(
  "click",
  interact
);


function distance(a,b,c,d) {

  return Math.hypot(
    a-c,
    b-d
  );
}


function interact() {

  /* HATCH */

  if (
    distance(
      player.x,
      player.y,
      hatch.x,
      hatch.y
    )
    < 80
  ) {

    document
      .getElementById("underground")
      .style.display = "flex";

    return;
  }


  /* GATE */

  const gateCenterX =
    gate.x + gate.width/2;

  const gateCenterY =
    outer.bottom - 30;


  if (
    distance(
      player.x,
      player.y,
      gateCenterX,
      gateCenterY
    )
    < 120
  ) {

    gate.open =
      !gate.open;

    showMessage(
      gate.open
      ? "Ворота открыты"
      : "Ворота закрыты"
    );

    return;
  }


  showMessage(
    "Здесь пока нечего делать"
  );
}


function closeUnderground() {

  document
    .getElementById("underground")
    .style.display = "none";
}


/* MESSAGE */

let messageTimer = null;

function showMessage(text) {

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(() => {

      box.classList.remove("show");

    }, 1500);
}


/* DRAW */

function drawGround() {

  ctx.fillStyle =
    "#41463a";

  ctx.fillRect(
    0,
    0,
    world.width,
    world.height
  );


  /* dirty patches */

  for (
    let x = 0;
    x < world.width;
    x += 90
  ) {

    for (
      let y = 0;
      y < world.height;
      y += 90
    ) {

      const n =
        Math.sin(x*.04 + y*.03);

      if (n > .35) {

        ctx.fillStyle =
          "rgba(75,65,45,.18)";

        ctx.beginPath();

        ctx.arc(
          x + 40,
          y + 40,
          30,
          0,
          Math.PI*2
        );

        ctx.fill();
      }
    }
  }
}


function drawWall() {

  ctx.fillStyle =
    "#55585a";


  /* TOP */

  ctx.fillRect(
    outer.left,
    outer.top,
    outer.right -
    outer.left,
    outer.thickness
  );


  /* LEFT */

  ctx.fillRect(
    outer.left,
    outer.top,
    outer.thickness,
    outer.bottom -
    outer.top
  );


  /* RIGHT */

  ctx.fillRect(
    outer.right -
    outer.thickness,
    outer.top,
    outer.thickness,
    outer.bottom -
    outer.top
  );


  /* BOTTOM LEFT */

  ctx.fillRect(
    outer.left,
    outer.bottom -
    outer.thickness,
    gate.x -
    outer.left,
    outer.thickness
  );


  /* BOTTOM RIGHT */

  ctx.fillRect(
    gate.x +
    gate.width,
    outer.bottom -
    outer.thickness,

    outer.right -
    (
      gate.x +
      gate.width
    ),

    outer.thickness
  );


  /* DETAIL */

  ctx.strokeStyle =
    "#252829";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    outer.left,
    outer.top,
    outer.right -
    outer.left,
    outer.bottom -
    outer.top
  );


  /* GATE */

  if (!gate.open) {

    ctx.fillStyle =
      "#2e302f";

    ctx.fillRect(
      gate.x,
      outer.bottom -
      outer.thickness,

      gate.width,
      outer.thickness
    );


    ctx.strokeStyle =
      "#111";

    ctx.lineWidth = 5;

    for (
      let x = gate.x;
      x <
      gate.x +
      gate.width;
      x += 18
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x,
        outer.bottom -
        outer.thickness
      );

      ctx.lineTo(
        x,
        outer.bottom
      );

      ctx.stroke();
    }
  }
}


function drawTowers() {

  towers.forEach(
    ([x,y]) => {

      ctx.fillStyle =
        "#292d2d";

      ctx.fillRect(
        x-25,
        y-25,
        50,
        50
      );

      ctx.fillStyle =
        "#727878";

      ctx.fillRect(
        x-18,
        y-18,
        36,
        36
      );

      ctx.fillStyle =
        "#ffd87a";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        5,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  );
}


function drawInnerBase() {

  ctx.strokeStyle =
    "#777";

  ctx.lineWidth =
    inner.thickness;

  ctx.strokeRect(
    inner.left,
    inner.top,
    inner.right -
    inner.left,
    inner.bottom -
    inner.top
  );


  /* central floor */

  ctx.fillStyle =
    "#69665b";

  ctx.fillRect(
    inner.left +
    inner.thickness,
    inner.top +
    inner.thickness,

    inner.right -
    inner.left -
    inner.thickness*2,

    inner.bottom -
    inner.top -
    inner.thickness*2
  );
}


function drawHatch() {

  ctx.fillStyle =
    "#111";

  ctx.fillRect(
    hatch.x-32,
    hatch.y-32,
    64,
    64
  );


  ctx.strokeStyle =
    "#999";

  ctx.lineWidth = 4;

  ctx.strokeRect(
    hatch.x-32,
    hatch.y-32,
    64,
    64
  );


  ctx.fillStyle =
    "#aaa";

  ctx.font =
    "16px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "ЛЮК",
    hatch.x,
    hatch.y+5
  );
}


function drawObjects() {

  for (
    const obj of objects
  ) {

    if (
      obj.type === "farm"
    ) {

      ctx.fillStyle =
        "#423722";

      ctx.fillRect(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );


      for (
        let x =
          obj.x+20;
        x <
          obj.x+
          obj.w;
        x += 38
      ) {

        for (
          let y =
            obj.y+20;
          y <
            obj.y+
            obj.h;
          y += 38
        ) {

          ctx.fillStyle =
            "#568c43";

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
          );

          ctx.fill();
        }
      }
    }


    if (
      obj.type ===
      "generator"
    ) {

      ctx.fillStyle =
        "#c99124";

      ctx.fillRect(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );

      ctx.fillStyle =
        "#222";

      ctx.fillRect(
        obj.x+15,
        obj.y+20,
        35,
        30
      );
    }


    if (
      obj.type === "car"
    ) {

      ctx.fillStyle =
        "#29333a";

      ctx.fillRect(
        obj.x,
        obj.y,
        obj.w,
        obj.h
      );

      ctx.fillStyle =
        "#111";

      ctx.fillRect(
        obj.x+20,
        obj.y+8,
        65,
        28
      );
    }


    if (
      obj.type === "water"
    ) {

      ctx.fillStyle =
        "#315d74";

      ctx.beginPath();

      ctx.arc(
        obj.x+35,
        obj.y+35,
        35,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }
}


function drawPlayer() {

  ctx.fillStyle =
    "#1d1f20";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y,
    player.radius,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#d0ad88";

  ctx.beginPath();

  ctx.arc(
    player.x,
    player.y-12,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#3f5362";

  ctx.fillRect(
    player.x-10,
    player.y-3,
    20,
    23
  );
}


/* LOOP */

function update() {

  let nx =
    player.x +
    moveX *
    player.speed;

  let ny =
    player.y +
    moveY *
    player.speed;


  if (
    !collision(
      nx,
      player.y
    )
  ) {

    player.x =
      nx;
  }


  if (
    !collision(
      player.x,
      ny
    )
  ) {

    player.y =
      ny;
  }


  camera.x =
    player.x -
    screenW/2;

  camera.y =
    player.y -
    screenH/2;


  camera.x =
    Math.max(
      0,
      Math.min(
        camera.x,
        world.width -
        screenW
      )
    );


  camera.y =
    Math.max(
      0,
      Math.min(
        camera.y,
        world.height -
        screenH
      )
    );
}


function draw() {

  ctx.clearRect(
    0,
    0,
    screenW,
    screenH
  );


  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  drawGround();

  drawWall();

  drawTowers();

  drawInnerBase();

  drawObjects();

  drawHatch();

  drawPlayer();


  ctx.restore();
}


function loop() {

  update();

  draw();

  requestAnimationFrame(
    loop
  );
}


loop();

</script>

</body>
</html>
